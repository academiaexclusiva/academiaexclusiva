html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;letter-spacing:.01em}
h2{font-size:1.6rem} h3{font-size:1.25rem}
.muted{color:var(--muted)} .small{font-size:.875rem}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* barra superior */
.top{background:var(--graphite);color:#F3F5F4;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:4px solid var(--pencil)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.45rem;font-weight:700;white-space:nowrap}
.brand-dot{width:22px;height:22px;border-radius:50%;background:var(--pencil);box-shadow:inset 0 0 0 4px var(--graphite),0 0 0 2px var(--pencil)}
.top .crumb{background:none;border:0;color:#C9D0D4;cursor:pointer;padding:6px 4px;font-size:.95rem}
.top .crumb:hover{color:#fff}
.top .title{font-family:var(--display);font-size:1.35rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sync{font-size:.8rem;color:#AEB7BD;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:#BAC2C7;padding:10px 14px 12px;cursor:pointer;font-weight:700;white-space:nowrap;border-radius:8px 8px 0 0}
.tab[aria-selected="true"]{background:var(--pencil);color:var(--pencil-ink)}
.tab:not([aria-selected="true"]):hover{color:#fff}

main{padding:22px 0 60px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px;margin-bottom:18px}
.panel > h3{margin-bottom:4px}
.panel > .muted:first-of-type{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.875rem;color:var(--muted)}
input[type=text],input[type=number],input[type=password],select,textarea,input:not([type]){background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius-s);padding:8px 10px;color:var(--ink);min-width:0;width:100%}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--pencil)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pencil);border-color:var(--pencil);color:var(--pencil-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;font-size:.875rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sunk)}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--graphite);color:#fff}
.note{border-left:4px solid var(--pencil);background:var(--sunk);padding:10px 14px;border-radius:0 var(--radius-s) var(--radius-s) 0;margin:12px 0}
.note.bad{border-color:var(--bad)}
.empty{text-align:center;padding:48px 16px}
.empty p{max-width:46ch;margin:10px auto 18px}

/* inicio */
.exam-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
.exam-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.exam-card:hover{border-color:var(--muted)}
.exam-card h3{font-size:1.4rem}
.exam-card .stats{display:flex;gap:16px;font-size:.9rem;color:var(--muted)}
.exam-card .stats b{font-family:var(--display);font-size:1.3rem;color:var(--ink);display:block;line-height:1}

/* cursos */
.sec-table{width:100%;border-collapse:collapse;margin-top:10px}
.sec-table th{font-size:.8rem;font-weight:700;color:var(--muted);text-align:left;padding:4px 6px}
.sec-table td{padding:4px 6px;vertical-align:middle}
.sec-table input{padding:6px 8px}
.sec-table .num{width:78px}
.swatch{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:middle;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.scroll-x{overflow-x:auto}

/* clave */
.key-grid{columns:250px;column-gap:22px;margin-top:12px}
.key-sec{break-inside:avoid;margin:10px 0 4px;font-family:var(--display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.key-scan{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sunk);border:1px dashed var(--pencil);border-radius:var(--radius-m);padding:12px 14px;margin:10px 0}
.key-scan > div:first-child{flex:1;min-width:220px}
.key-result{display:flex;gap:14px;align-items:flex-start;border-radius:var(--radius-m);padding:12px;margin:0 0 10px;border:1px solid var(--line);border-left:5px solid var(--ok);background:var(--surface)}
.key-result.warn{border-left-color:var(--pencil)}
.key-result img{width:110px;border-radius:6px;border:1px solid var(--line);flex:none}
.key-result ul{margin:6px 0;padding-left:18px}
.krow.kflag{background:color-mix(in srgb,var(--pencil) 28%,transparent);border-radius:6px}
.krow{display:flex;align-items:center;gap:4px;padding:2px 0;break-inside:avoid}
.kn{width:34px;text-align:right;font-family:var(--display);font-weight:700;font-size:1.05rem;padding-right:4px;border-right:3px solid var(--c,var(--line))}
.kb{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--muted);padding:0}
.kb.on{background:var(--graphite);border-color:var(--graphite);color:#fff}
:root[data-theme="dark"] .kb.on{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kb.on{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil)}}
.kbonus{width:28px;height:28px;border:0;background:none;cursor:pointer;color:var(--line);font-size:1.05rem;padding:0}
.kbonus.on{color:var(--warn)}
.kpts{width:56px!important;padding:4px 6px!important;font-size:.85rem;margin-left:2px}

/* hoja */
.sheet-frame{background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;display:flex;justify-content:center;overflow:auto}
.sheet-frame > svg{width:100%;max-width:620px;height:auto;background:#fff;box-shadow:0 1px 0 var(--line),0 10px 24px rgba(0,0,0,.08)}

/* escaneo */
.cam{position:relative;background:#101214;border-radius:var(--radius-m);overflow:hidden;min-height:220px;display:flex;align-items:center;justify-content:center}
.cam video{width:100%;height:auto;display:block}
.cam canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam .pill{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.65);color:#fff;padding:6px 12px;border-radius:999px;font-size:.9rem;font-weight:700}
.cam .pill.ok{background:var(--ok)}
.cam-idle{color:#B9C1C6;text-align:center;padding:30px;max-width:40ch}
.scan-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){:root:not([data-view="pc"]) .scan-layout{grid-template-columns:1fr}}
.last{display:flex;gap:14px;align-items:center}
.last img{width:92px;border-radius:6px;border:1px solid var(--line)}
.big-note{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:.9}
.big-note small{font-size:1.2rem;color:var(--muted);font-weight:600}
.log{list-style:none;padding:0;margin:10px 0 0;font-size:.9rem;max-height:240px;overflow:auto}
.log li{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.log .e{color:var(--bad)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.switch input{width:20px;height:20px;accent-color:var(--pencil)}

/* resultados */
table.res{width:100%;border-collapse:collapse;font-size:.92rem}
table.res th{position:sticky;top:0;background:var(--surface);font-size:.8rem;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap}
table.res th[data-sorted]{color:var(--ink)}
table.res td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.res tbody tr{cursor:pointer}
table.res tbody tr:hover{background:var(--sunk)}
.note-cell{font-family:var(--display);font-weight:700;font-size:1.2rem}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.eff-cell{display:inline-block;min-width:44px;text-align:center;border-radius:4px;padding:1px 6px;font-weight:700;font-size:.85rem}

/* análisis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:2.1rem;line-height:1;font-weight:700}
.kpi span{font-size:.85rem;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 58px;gap:10px;align-items:center}
.bar-row .lbl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:18px;background:var(--sunk);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
.bar-row .val{font-family:var(--display);font-weight:700;font-size:1.15rem;text-align:right}
.bar-row .sub{grid-column:2/4;font-size:.8rem;color:var(--muted);margin-top:-8px}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:14px}
.hq{aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;color:#fff;font-family:var(--display);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-size:1.05rem;position:relative}
.hq small{font-size:.68rem;font-family:var(--body);opacity:.9;margin-top:2px}
.hq[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--ink)}
.hq.nokey{background:var(--sunk)!important;color:var(--muted);border:1.5px dashed var(--line)}
.legend{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend .grad{width:140px;height:10px;border-radius:999px;background:linear-gradient(90deg,hsl(0 62% 46%),hsl(40 75% 45%),hsl(130 50% 36%))}
.dist{display:grid;grid-template-columns:96px 1fr 76px;gap:8px;align-items:center;font-size:.9rem;margin-top:6px}

/* modal detalle */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,14,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px max(16px,env(safe-area-inset-bottom,0px))}
.modal-card{background:var(--surface);border-radius:var(--radius-m);width:100%;max-width:980px;padding:18px;position:relative}
.modal-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.modal-head .grow{flex:1;min-width:180px;display:grid;grid-template-columns:1fr 130px;gap:8px}
.det{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){:root:not([data-view="pc"]) .det{grid-template-columns:1fr}}
.rev{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rev img{display:block;width:100%;height:auto}
.rev svg{position:absolute;inset:0;width:100%;height:100%}
.qlist{border-collapse:collapse;width:100%;font-size:.9rem}
.qlist td{padding:5px 6px;border-bottom:1px solid var(--line)}
.qlist .mb{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);background:none;font-size:.7rem;font-weight:700;cursor:pointer;padding:0;color:var(--muted)}
.qlist .mb.on{background:var(--graphite);color:#fff;border-color:var(--graphite)}
.qlist .mb.key{box-shadow:0 0 0 2px var(--ok)}
.st{font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.ok,.st.bonus{background:var(--ok-soft);color:var(--ok)} .st.bad,.st.multi{background:var(--bad-soft);color:var(--bad)} .st.blank{background:var(--sunk);color:var(--muted)} .st.nokey{color:var(--muted)} .st.warn{background:#FCEFC7;color:#8A5A00} .qlist tr.doubt td{background:color-mix(in srgb,var(--pencil) 16%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--graphite);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.hidden{display:none!important}
#printArea{display:none}
.fav-panel{border-left:5px solid var(--ok)}
.fav-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fav-chip{display:inline-flex;align-items:center;gap:6px;background:var(--ok-soft);color:var(--ink);border-radius:999px;padding:2px 4px 2px 12px;font-size:.85rem}
.fav-form{margin-top:12px;display:grid;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.fav-form .f{max-width:320px}
.fav-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.fav-mode{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--radius-m);padding:12px;cursor:pointer;background:var(--sunk)}
.fav-mode:has(input:checked){border-color:var(--ok)}
.fav-mode input[type=radio]{width:18px;height:18px;margin-top:3px;accent-color:var(--ok)}
.fav-letters{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.fav-letters label{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.fav-letters input{width:18px;height:18px;accent-color:var(--ok)}
.fav-form .btn{justify-self:start}
.logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:inline-block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:inline-block}
.brand-logo{height:34px;width:auto;display:block}
.brand-sep{width:1px;height:26px;background:rgba(255,255,255,.25)}
.brand-app{font-size:1.15rem;color:#E6E9EB}
.brand-icon{height:30px;width:30px;flex:none}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--muted)}
.auth-logo-img{width:200px;max-width:80%;height:auto}
.qz-head{flex-wrap:wrap}
.qz-logo{height:44px;width:auto}
.qz-head-sep{width:1px;height:28px;background:var(--line)}
.qz-bar-logo{height:32px;width:32px;flex:none}
:root[data-view="movil"] .brand-sep,:root[data-view="movil"] .brand-app{display:none}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3DDC84;margin-right:6px;box-shadow:0 0 0 3px rgba(61,220,132,.25);animation:pulse 2s infinite}
.live-dot.off{background:var(--bad);box-shadow:none;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(61,220,132,0)}}
.st.virt{background:#E4ECFB;color:#1F4FBF}
.quiz-card{border-left:5px solid var(--pencil)}
.pdf-chip{display:inline-block;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;font-weight:700}
.qz-nopdf{display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;background:var(--sunk)}
.qz-nopdf div{max-width:360px}
.quiz-card.off{border-left-color:var(--blank);opacity:.85}
/* ---- examen virtual (alumno) ---- */
.qz-land{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 40px}
.qz-head{width:100%;max-width:640px;display:flex;align-items:center;gap:10px;padding:18px 0;font-family:var(--display);font-weight:700;font-size:1.4rem}
.qz-box{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--pencil);border-radius:var(--radius-m);padding:24px}
.qz-box h1{font-family:var(--display);font-size:2rem;margin:2px 0 14px;line-height:1.1}
.qz-ok{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--muted);margin:16px 0}
.qz-ok input{width:20px;height:20px;flex:none;accent-color:var(--pencil);margin-top:2px}
.qz-min{font-size:1.15rem;text-align:center;padding:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.qz-rules{color:var(--muted);padding-left:18px}
.qz-exam{display:flex;flex-direction:column;height:100vh;height:100dvh}
.qz-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--graphite);color:#fff;border-bottom:4px solid var(--pencil);padding-top:calc(10px + env(safe-area-inset-top,0px))}
.qz-info{flex:1;min-width:0;display:flex;flex-direction:column}
.qz-info b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qz-info .small{color:#C9D0D4}
.qz-clock{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.1);border-radius:10px;padding:4px 12px}
.qz-clock .small{color:#C9D0D4;font-size:.7rem}
.qz-clock b{font-family:var(--display);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.qz-clock.hurry{background:var(--bad)}
.qz-body{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
.qz-sheet{overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:0 8px}
.qz-sheet-head{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:10px 4px;font-weight:700;border-bottom:1px solid var(--line);z-index:1}
.qz-row{display:flex;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px solid var(--line)}
.qz-row:nth-child(odd){background:var(--sunk)}
.qz-n{width:30px;text-align:right;font-family:var(--display);font-weight:700;font-size:1.05rem;margin-right:4px}
.qz-row button{width:34px;height:34px;border-radius:50%;border:1.6px solid var(--muted);background:var(--surface);color:var(--muted);font-weight:700;cursor:pointer;padding:0}
.qz-row button.on{background:var(--graphite);border-color:var(--graphite);color:#fff}
:root[data-theme="dark"] .qz-row button.on{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil)}
.qz-pdf{overflow:auto;background:#5B6066;padding:12px}
.qz-page{display:block;max-width:1000px;margin:0 auto 6px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.qz-pnum{color:#E6E9EB;font-size:.75rem;text-align:center;margin:8px 0 4px}
.qz-frame{width:100%;height:80vh;border:0;background:#fff}
.qz-foot{padding:6px 14px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);color:var(--muted)}
.qz-seg{margin:8px auto;display:flex}
.qz-exam.mob .qz-body{grid-template-columns:1fr}
.qz-exam.mob.show-pdf .qz-sheet{display:none}
.qz-exam.mob.show-sheet .qz-pdf{display:none}
.qz-exam.mob .qz-sheet{border-right:0}
.qz-check{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
@media (max-width:560px){.qz-bar .btn{padding:6px 10px}.qz-info .small{display:none}}
.type-badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.02em;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);align-self:flex-start;font-family:var(--body)}
.type-badge.uni{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil)}
.exam-card.uni{border-top:4px solid var(--pencil)}
.uni-dots{display:flex;gap:6px;flex-wrap:wrap}
.uni-dots span{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;background:var(--c)}
.choose-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.choose-card{text-align:left;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--radius-m);border:2px solid var(--line);background:var(--sunk);cursor:pointer;color:var(--ink)}
.choose-card b{font-family:var(--display);font-size:1.35rem}
.choose-card span{font-size:.9rem;color:var(--muted)}
.choose-card:hover{border-color:var(--ink)}
.choose-card.uni{border-color:var(--pencil)}
.uni-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:18px}
.uni-card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--radius-m);padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.uni-num{position:absolute;top:10px;right:14px;font-family:var(--display);font-weight:700;font-size:2rem;color:var(--c);opacity:.9}
.uni-name{font-family:var(--display);font-weight:700;font-size:1.25rem !important;background:transparent !important;border-color:transparent !important;padding:4px 6px !important;margin-left:-6px;width:calc(100% - 50px) !important}
.uni-name:hover,.uni-name:focus{border-color:var(--line) !important;background:var(--sunk) !important}
.uni-card .stats{display:flex;gap:16px;font-size:.9rem;color:var(--muted)}
.uni-card .stats b{font-family:var(--display);font-size:1.3rem;color:var(--ink);display:block;line-height:1}
.auth-wrap{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--pencil);border-radius:var(--radius-m);padding:26px 22px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.auth-err{min-height:22px;color:var(--bad);font-weight:700;font-size:.9rem;margin:10px 0 4px}
main .auth-wrap{min-height:auto}
.cam.has-result{display:block;background:var(--surface);border:1px solid var(--line)}
.cam.has-result video,.cam.has-result canvas,.cam.has-result .pill{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.cam-result{padding:12px}
.cr-head{display:flex;align-items:center;justify-content:center;gap:10px}
.cr-score{font-family:var(--display);font-weight:700;font-size:1.9rem;text-align:center;line-height:1.1}
.cr-score small{display:block;font-size:1.15rem}
.cam{scroll-margin-top:calc(110px + env(safe-area-inset-top,0px))}
.cr-name{text-align:center;color:var(--muted);margin:2px 0 8px}
.cr-warn{text-align:center;font-weight:700;color:#8A5A00;background:#FCEFC7;border-radius:8px;padding:6px;margin-bottom:8px}
.cam-result .rev{max-width:520px;margin:0 auto}
.cam .pill{max-width:calc(100% - 24px)}
/* botones de vista y tema */
.tools{display:flex;gap:6px;align-items:center}
.icon-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#EEF1F2;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.85rem;white-space:nowrap}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn svg{width:18px;height:18px;flex:none}
.tab svg{display:none}
.rcards{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.rcard{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius-m);padding:12px;cursor:pointer;text-align:left;width:100%}
.rcard .nm{font-weight:700;line-height:1.25}
.rcard .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rcard .chip{font-size:.72rem;font-weight:700;color:#fff;border-radius:999px;padding:1px 7px}

/* ===== Formato PC ===== */
:root[data-view="pc"] body{min-width:1024px}
:root[data-view="pc"] .wrap{max-width:1280px}

/* ===== Formato celular ===== */
:root[data-view="movil"] .wrap{max-width:540px;padding:0 12px}
:root[data-view="movil"] .panel{padding:14px}
:root[data-view="movil"] .scan-layout,:root[data-view="movil"] .det,:root[data-view="movil"] .two{grid-template-columns:1fr}
:root[data-view="movil"] .grid-fields{grid-template-columns:1fr 1fr}
:root[data-view="movil"] .kpis{grid-template-columns:repeat(2,1fr)}
:root[data-view="movil"] .kpi b{font-size:1.7rem}
:root[data-view="movil"] .kpi:last-child:nth-child(odd){grid-column:1/-1}
:root[data-view="movil"] .exam-list{grid-template-columns:1fr}
:root[data-view="movil"] .sync,:root[data-view="movil"] .icon-btn span{display:none}
:root[data-view="movil"] .icon-btn{padding:8px}
:root[data-view="movil"] .brand{font-size:1.2rem}
:root[data-view="movil"] .key-grid{columns:1}
:root[data-view="movil"] .big-note{font-size:2.6rem}
:root[data-view="movil"] .bar-row{grid-template-columns:90px 1fr 50px}
:root[data-view="movil"] .modal{padding-left:6px;padding-right:6px}
:root[data-view="movil"] .modal-card{padding:12px}
:root[data-view="movil"] .modal-head .grow{grid-template-columns:1fr}
:root[data-view="movil"] .heat{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
:root[data-view="movil"] .tabs-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--graphite);border-top:3px solid var(--pencil);padding:0 0 env(safe-area-inset-bottom,0px);max-width:none}
:root[data-view="movil"] .tabs{justify-content:space-around;gap:0}
:root[data-view="movil"] .tab{flex:1;border-radius:0;padding:7px 2px 9px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:3px}
:root[data-view="movil"] .tab svg{display:block;width:22px;height:22px}
:root[data-view="movil"] main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
:root[data-view="movil"] .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
:root[data-view="movil"] .sheet-frame{padding:8px}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea > svg{width:210mm;height:297mm;display:block}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){ :root:not([data-view="pc"]) .sync{display:none} :root:not([data-view="pc"]) .wrap{padding:0 12px} :root:not([data-view="pc"]) .panel{padding:14px} :root:not([data-view="pc"]) .big-note{font-size:2.6rem} :root:not([data-view="pc"]) .bar-row{grid-template-columns:90px 1fr 50px} }
</style>
</head>

const SETUP_SQL = "-- =====================================================================\n--  Lector de cartillas \u00b7 Configuraci\u00f3n de Supabase\n--  Pega TODO este script en Supabase \u203a SQL Editor \u203a New query y presiona Run.\n--  Se puede ejecutar m\u00e1s de una vez sin problema.\n-- =====================================================================\n\ncreate extension if not exists pgcrypto with schema extensions;\n\n-- ---------- Tablas ----------\ncreate table if not exists public.perfiles (\n  id uuid primary key references auth.users(id) on delete cascade,\n  usuario text unique not null,\n  nombre text not null default '',\n  rol text not null default 'tutor' check (rol in ('admin', 'tutor')),\n  activo boolean not null default true,\n  debe_cambiar boolean not null default false,\n  creado timestamptz not null default now()\n);\n\n-- Evaluaciones, simulacros UNI y hojas calificadas (cada fila guarda un objeto del programa)\ncreate table if not exists public.docs (\n  id text primary key,\n  kind text not null check (kind in ('exam', 'res', 'grp')),\n  data jsonb not null,\n  updated_at timestamptz not null default now(),\n  updated_by uuid default auth.uid()\n);\ncreate index if not exists docs_kind_idx on public.docs (kind);\n\n-- Ex\u00e1menes virtuales (lo que ve el alumno: sin la clave)\ncreate table if not exists public.quizzes (\n  id uuid primary key default gen_random_uuid(),\n  exam_id text not null,\n  titulo text not null,\n  minutos int not null default 60 check (minutos between 1 and 600),\n  n_preguntas int not null default 0,\n  pdf_url text,\n  activo boolean not null default true,\n  mostrar_nota boolean not null default true,\n  creado_por uuid default auth.uid(),\n  creado timestamptz not null default now()\n);\ncreate index if not exists quizzes_exam_idx on public.quizzes (exam_id);\n\n-- Intentos de los alumnos (un intento por DNI en cada examen virtual)\ncreate table if not exists public.intentos (\n  id uuid primary key default gen_random_uuid(),\n  quiz_id uuid not null references public.quizzes(id) on delete cascade,\n  dni text not null,\n  nombre text not null,\n  token uuid not null default gen_random_uuid(),\n  inicio timestamptz not null default now(),\n  fin_limite timestamptz not null,\n  respuestas jsonb not null default '[]'::jsonb,\n  enviado boolean not null default false,\n  enviado_at timestamptz,\n  resultado jsonb,\n  unique (quiz_id, dni)\n);\n\n-- ---------- Funciones de permisos ----------\ncreate or replace function public.es_activo() returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.perfiles where id = auth.uid() and activo);\n$$;\n\ncreate or replace function public.es_admin() returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.perfiles where id = auth.uid() and activo and rol = 'admin');\n$$;\n\n-- ---------- Seguridad por filas (RLS) ----------\nalter table public.perfiles enable row level security;\nalter table public.docs enable row level security;\nalter table public.quizzes enable row level security;\nalter table public.intentos enable row level security;\n\ndrop policy if exists perfiles_leer on public.perfiles;\ncreate policy perfiles_leer on public.perfiles for select to authenticated using (true);\ndrop policy if exists perfiles_admin on public.perfiles;\ncreate policy perfiles_admin on public.perfiles for all to authenticated using (public.es_admin()) with check (public.es_admin());\n\ndrop policy if exists docs_leer on public.docs;\ncreate policy docs_leer on public.docs for select to authenticated using (public.es_activo());\ndrop policy if exists docs_insertar on public.docs;\ncreate policy docs_insertar on public.docs for insert to authenticated with check (public.es_activo());\ndrop policy if exists docs_editar on public.docs;\ncreate policy docs_editar on public.docs for update to authenticated using (public.es_activo()) with check (public.es_activo());\ndrop policy if exists docs_borrar on public.docs;\ncreate policy docs_borrar on public.docs for delete to authenticated using (public.es_activo() and (kind = 'res' or public.es_admin()));\n\ndrop policy if exists quizzes_publico on public.quizzes;\ncreate policy quizzes_publico on public.quizzes for select to anon using (activo);\ndrop policy if exists quizzes_leer on public.quizzes;\ncreate policy quizzes_leer on public.quizzes for select to authenticated using (true);\ndrop policy if exists quizzes_gestion on public.quizzes;\ncreate policy quizzes_gestion on public.quizzes for all to authenticated using (public.es_activo()) with check (public.es_activo());\n\ndrop policy if exists intentos_leer on public.intentos;\ncreate policy intentos_leer on public.intentos for select to authenticated using (public.es_activo());\ndrop policy if exists intentos_borrar on public.intentos;\ncreate policy intentos_borrar on public.intentos for delete to authenticated using (public.es_activo());\n\n-- ---------- Calificaci\u00f3n (misma regla que el programa) ----------\ncreate or replace function public.calificar(p_exam jsonb, p_resp jsonb) returns jsonb\nlanguage plpgsql immutable set search_path = public as $$\ndeclare\n  nq int := coalesce((p_exam->>'nQ')::int, 0);\n  i int; k text; a text; sec jsonb; s jsonb; ov text;\n  pts numeric; sc numeric := 0; mx numeric := 0;\n  c int := 0; w int := 0; b int := 0;\nbegin\n  for i in 1..nq loop\n    k := coalesce(p_exam->'key'->>(i - 1), '');\n    if k = '' then continue; end if;\n    a := coalesce(p_resp->>(i - 1), '');\n    sec := null;\n    for s in select value from jsonb_array_elements(coalesce(p_exam->'sections', '[]'::jsonb)) loop\n      if i >= (s->>'from')::numeric and i <= (s->>'to')::numeric then sec := s; exit; end if;\n    end loop;\n    ov := p_exam->'ptsOv'->>((i - 1)::text);\n    if ov is not null and ov <> '' then pts := ov::numeric;\n    elsif sec is not null then pts := coalesce((sec->>'pts')::numeric, 1);\n    else pts := 1; end if;\n    mx := mx + pts;\n    if k = '*' then sc := sc + pts; c := c + 1;\n    elsif a = '' then sc := sc + coalesce((sec->>'blank')::numeric, 0); b := b + 1;\n    elsif length(a) > 1 or position(a in k) = 0 then sc := sc + coalesce((sec->>'wrong')::numeric, 0); w := w + 1;\n    else sc := sc + pts; c := c + 1; end if;\n  end loop;\n  return jsonb_build_object('puntaje', sc, 'maximo', mx, 'correctas', c, 'incorrectas', w, 'blanco', b,\n    'nota', case when mx > 0 then round(greatest(sc, 0) / mx * 20, 2) else 0 end);\nend $$;\n\n-- ---------- Examen virtual: funciones que usa el alumno ----------\ncreate or replace function public.iniciar_intento(p_quiz uuid, p_dni text, p_nombre text, p_token uuid default null)\nreturns jsonb language plpgsql security definer set search_path = public as $$\ndeclare q public.quizzes; t public.intentos;\nbegin\n  select * into q from public.quizzes where id = p_quiz;\n  if not found or not q.activo then return jsonb_build_object('error', 'no_disponible'); end if;\n  p_dni := regexp_replace(coalesce(p_dni, ''), '\\s', '', 'g');\n  if p_dni !~ '^[0-9]{6,12}$' then return jsonb_build_object('error', 'dni'); end if;\n  if length(trim(coalesce(p_nombre, ''))) < 2 then return jsonb_build_object('error', 'nombre'); end if;\n  select * into t from public.intentos where quiz_id = p_quiz and dni = p_dni;\n  if found then\n    if t.enviado then return jsonb_build_object('error', 'ya_enviado'); end if;\n    if p_token is null or p_token <> t.token then return jsonb_build_object('error', 'en_curso'); end if;\n  else\n    insert into public.intentos (quiz_id, dni, nombre, fin_limite)\n      values (p_quiz, p_dni, trim(p_nombre), now() + make_interval(mins => q.minutos))\n      returning * into t;\n  end if;\n  return jsonb_build_object('id', t.id, 'token', t.token, 'fin', t.fin_limite, 'ahora', now(),\n    'respuestas', t.respuestas, 'titulo', q.titulo, 'n', q.n_preguntas, 'nombre', t.nombre, 'dni', t.dni);\nend $$;\n\ncreate or replace function public._cerrar_intento(p_id uuid) returns jsonb\nlanguage plpgsql security definer set search_path = public as $$\ndeclare t public.intentos; q public.quizzes; ex jsonb; r jsonb; rid text;\nbegin\n  select * into t from public.intentos where id = p_id for update;\n  if not found then return jsonb_build_object('error', 'no_encontrado'); end if;\n  select * into q from public.quizzes where id = t.quiz_id;\n  if t.enviado then\n    return jsonb_build_object('ok', true, 'resultado', case when q.mostrar_nota then t.resultado else null end);\n  end if;\n  select data into ex from public.docs where id = 'exam_' || q.exam_id;\n  r := public.calificar(coalesce(ex, '{}'::jsonb), t.respuestas);\n  rid := 'v' || replace(t.id::text, '-', '');\n  insert into public.docs (id, kind, data, updated_at) values ('res_' || rid, 'res', jsonb_build_object(\n      'id', rid, 'examId', q.exam_id, 'studentId', t.dni, 'name', t.nombre, 'answers', t.respuestas,\n      'doubts', '[]'::jsonb, 'img', null, 'created', floor(extract(epoch from now()) * 1000),\n      'source', 'virtual', 'quizId', q.id::text, 'quizTitle', q.titulo,\n      'minutos', round((extract(epoch from (least(now(), t.fin_limite) - t.inicio)) / 60.0)::numeric, 1)), now())\n    on conflict (id) do update set data = excluded.data, updated_at = now();\n  update public.intentos set enviado = true, enviado_at = now(), resultado = r where id = p_id;\n  return jsonb_build_object('ok', true, 'resultado', case when q.mostrar_nota then r else null end);\nend $$;\nrevoke execute on function public._cerrar_intento(uuid) from public, anon, authenticated;\n\ncreate or replace function public.guardar_respuestas(p_id uuid, p_token uuid, p_resp jsonb)\nreturns jsonb language plpgsql security definer set search_path = public as $$\ndeclare t public.intentos;\nbegin\n  select * into t from public.intentos where id = p_id and token = p_token;\n  if not found then return jsonb_build_object('error', 'no_encontrado'); end if;\n  if t.enviado then return jsonb_build_object('error', 'ya_enviado'); end if;\n  if now() > t.fin_limite + interval '30 seconds' then\n    return public._cerrar_intento(t.id) || jsonb_build_object('cerrado', true);\n  end if;\n  update public.intentos set respuestas = coalesce(p_resp, '[]'::jsonb) where id = p_id;\n  return jsonb_build_object('ok', true, 'ahora', now(), 'fin', t.fin_limite);\nend $$;\n\ncreate or replace function public.enviar_intento(p_id uuid, p_token uuid, p_resp jsonb)\nreturns jsonb language plpgsql security definer set search_path = public as $$\ndeclare t public.intentos;\nbegin\n  select * into t from public.intentos where id = p_id and token = p_token;\n  if not found then return jsonb_build_object('error', 'no_encontrado'); end if;\n  if not t.enviado and p_resp is not null and now() <= t.fin_limite + interval '2 minutes' then\n    update public.intentos set respuestas = p_resp where id = p_id;\n  end if;\n  return public._cerrar_intento(p_id);\nend $$;\n\n-- Para tutores: califica los intentos cuyo tiempo ya termin\u00f3 (alumnos que cerraron la p\u00e1gina)\ncreate or replace function public.cerrar_vencidos(p_quiz uuid) returns int\nlanguage plpgsql security definer set search_path = public as $$\ndeclare t record; n int := 0;\nbegin\n  if not public.es_activo() then raise exception 'sin permiso'; end if;\n  for t in select id from public.intentos where quiz_id = p_quiz and not enviado and now() > fin_limite + interval '30 seconds' loop\n    perform public._cerrar_intento(t.id); n := n + 1;\n  end loop;\n  return n;\nend $$;\n\n-- ---------- Usuarios ----------\ncreate or replace function public.hay_admin() returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.perfiles where rol = 'admin');\n$$;\n\ncreate or replace function public.registrar_primer_admin(p_usuario text, p_nombre text) returns jsonb\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if auth.uid() is null then return jsonb_build_object('error', 'sin_sesion'); end if;\n  if exists (select 1 from public.perfiles where rol = 'admin') then return jsonb_build_object('error', 'ya_existe'); end if;\n  insert into public.perfiles (id, usuario, nombre, rol) values (auth.uid(), lower(trim(p_usuario)), trim(p_nombre), 'admin');\n  return jsonb_build_object('ok', true);\nend $$;\n\ncreate or replace function public.marcar_clave_cambiada() returns void\nlanguage sql security definer set search_path = public as $$\n  update public.perfiles set debe_cambiar = false where id = auth.uid();\n$$;\n\ncreate or replace function public.admin_cambiar_clave(p_user uuid, p_clave text) returns jsonb\nlanguage plpgsql security definer set search_path = public, extensions as $$\nbegin\n  if not public.es_admin() then return jsonb_build_object('error', 'sin_permiso'); end if;\n  if length(coalesce(p_clave, '')) < 8 then return jsonb_build_object('error', 'clave_corta'); end if;\n  update auth.users set encrypted_password = extensions.crypt(p_clave, extensions.gen_salt('bf')), updated_at = now() where id = p_user;\n  update public.perfiles set debe_cambiar = true where id = p_user;\n  return jsonb_build_object('ok', true);\nend $$;\n\ncreate or replace function public.admin_eliminar_usuario(p_user uuid) returns jsonb\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if not public.es_admin() then return jsonb_build_object('error', 'sin_permiso'); end if;\n  if p_user = auth.uid() then return jsonb_build_object('error', 'propio'); end if;\n  delete from auth.users where id = p_user;\n  return jsonb_build_object('ok', true);\nend $$;\n\n-- ---------- Tiempo real ----------\ndo $$ begin\n  begin alter publication supabase_realtime add table public.docs; exception when duplicate_object then null; end;\n  begin alter publication supabase_realtime add table public.quizzes; exception when duplicate_object then null; end;\n  begin alter publication supabase_realtime add table public.intentos; exception when duplicate_object then null; end;\nend $$;\n\n-- ---------- Archivos PDF de los ex\u00e1menes virtuales ----------\ninsert into storage.buckets (id, name, public) values ('examenes', 'examenes', true) on conflict (id) do nothing;\ndrop policy if exists \"examenes_subir\" on storage.objects;\ncreate policy \"examenes_subir\" on storage.objects for insert to authenticated with check (bucket_id = 'examenes' and public.es_activo());\ndrop policy if exists \"examenes_editar\" on storage.objects;\ncreate policy \"examenes_editar\" on storage.objects for update to authenticated using (bucket_id = 'examenes' and public.es_activo());\ndrop policy if exists \"examenes_borrar\" on storage.objects;\ncreate policy \"examenes_borrar\" on storage.objects for delete to authenticated using (bucket_id = 'examenes' and public.es_activo());\n\n-- ---------- Permisos de acceso (los proyectos nuevos de Supabase ya no los dan solos) ----------\ngrant usage on schema public to anon, authenticated;\ngrant select, insert, update, delete on public.perfiles, public.docs, public.quizzes, public.intentos to authenticated;\ngrant select on public.quizzes to anon;\ngrant execute on function public.es_activo(), public.es_admin(), public.hay_admin(),\n  public.calificar(jsonb, jsonb), public.cerrar_vencidos(uuid), public.registrar_primer_admin(text, text),\n  public.marcar_clave_cambiada(), public.admin_cambiar_clave(uuid, text), public.admin_eliminar_usuario(uuid) to authenticated;\ngrant execute on function public.hay_admin(), public.iniciar_intento(uuid, text, text, uuid),\n  public.guardar_respuestas(uuid, uuid, jsonb), public.enviar_intento(uuid, uuid, jsonb) to anon, authenticated;\n\n-- Listo. Vuelve al programa y crea la cuenta de administrador.\n";
/* ===== Núcleo OMR: formato tipo ZipGrade (bloques de 10 con ■) + lectura ===== */
const OMR = (() => {
  const W = 1000, H = 1414, OPTS = ['A', 'B', 'C', 'D', 'E'];
  const ID_ORDER = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0], OMR_ID_ORDER = ID_ORDER;
  const FORMATS = [{ cols: 3, slots: 2, p: 39, r: 13 }, { cols: 4, slots: 3, p: 30, r: 10.5 }];

  // La altura de la cartilla se ajusta a su contenido (para imprimir varias por hoja)
  function buildLayout(nQ, idDigits) {
    const nBlocks = Math.ceil(nQ / 10);
    let F = null, idSlots = 0, S = 1;
    for (const f of FORMATS) {
      const colW = 860 / f.cols, idW = f.p * 0.9 + idDigits * f.p;
      const s = idDigits > 0 ? Math.ceil(idW / colW) : 0;
      if (s > f.cols) continue;
      let slots = 1; while (f.cols * slots - s < nBlocks) slots++;
      if (slots <= f.slots) { F = f; idSlots = s; S = slots; break; }
    }
    if (!F) { F = FORMATS[1]; idSlots = idDigits > 0 ? Math.ceil((F.p * 0.9 + idDigits * F.p) / (860 / F.cols)) : 0; S = F.slots; }
    const { cols, p, r } = F, colW = 860 / cols, gap = p * 0.6, top = 262;
    // asignación en columnas (como ZipGrade): el código ocupa el primer lugar
    const cells = []; let k = 0;
    for (let c = 0; c < cols; c++) for (let s = 0; s < S; s++) {
      if (s === 0 && c < idSlots) { cells.push({ c, s, id: true }); continue; }
      if (k < nBlocks) { cells.push({ c, s, k, rows: Math.min(10, nQ - k * 10) }); k++; }
    }
    const usedCols = Math.max(...cells.map(x => x.c)) + 1;
    const LW = S === 1 && usedCols < cols ? Math.round(Math.max(600, 140 + usedCols * colW)) : W;
    const xOff = (LW - 140 - usedCols * colW) / 2;
    const slotRows = Array.from({ length: S }, (_, s) => Math.max(...cells.filter(x => x.s === s).map(x => x.id ? 10 : x.rows), 1));
    const slotY = []; let y = top;
    for (let s = 0; s < S; s++) { slotY.push(y); y += (slotRows[s] + 1) * p + gap; }
    const bottom = y - gap;
    const my = Math.round(bottom + 64), Hh = my + 58;
    const L = { W: LW, H: Hh, r, p, orient: { x: 140, y: 58, s: 26 }, markers: [{ x: 58, y: 58 }, { x: LW - 58, y: 58 }, { x: LW - 58, y: my }, { x: 58, y: my }], refs: [], blocks: [], q: [], id: [], idDigits, legendY: my - 8 };
    if (idDigits > 0) {
      const idW = p * 0.9 + idDigits * p, x0 = 70 + xOff + (idSlots * colW - idW) / 2, y0 = slotY[0];
      L.idBox = { x: x0, y: y0, w: idW, h: 11 * p, labelX: x0 + p * 0.4 };
      L.idWrite = [];
      for (let d = 0; d < idDigits; d++) {
        const cx = x0 + p * 1.4 + d * p;
        L.idWrite.push({ x: cx - p * 0.42, y: y0 + p * 0.1, w: p * 0.84, h: p * 0.8 });
        ID_ORDER.forEach((v, j) => L.id.push({ d, v, x: cx, y: y0 + p * 1.5 + j * p }));
      }
      L.idRows = ID_ORDER.map((v, j) => ({ v, y: y0 + p * 1.5 + j * p }));
    }
    const blockW = p * 5.55 + r;
    cells.filter(x => !x.id).forEach(cell => {
      const ox = 70 + xOff + cell.c * colW + (colW - blockW) / 2, y0 = slotY[cell.s], hy = y0 + p * 0.5;
      const ref = { x: ox + p * 0.6, y: hy, s: p * 0.55 };
      L.refs.push(ref);
      L.blocks.push({ k: cell.k, ox, y0, hy, ref, letters: OPTS.map((_, j) => ({ x: ox + p * 1.55 + j * p, y: hy })) });
      for (let j = 0; j < cell.rows; j++) {
        const n = cell.k * 10 + j + 1, cy = y0 + p * 1.5 + j * p;
        L.q.push({ n, block: cell.k, labelX: ox + p * 1.02, y: cy, b: OPTS.map((_, m) => ({ x: ox + p * 1.55 + m * p, y: cy })) });
      }
    });
    L.q.sort((a, b) => a.n - b.n);
    return L;
  }

  function grayFromRGBA(d, w, h) {
    const g = new Uint8ClampedArray(w * h);
    for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000;
    return g;
  }

  function binarize(g, w, h, t) {
    const W1 = w + 1, I = new Float64Array(W1 * (h + 1));
    for (let y = 0; y < h; y++) { let row = 0; for (let x = 0; x < w; x++) { row += g[y * w + x]; I[(y + 1) * W1 + x + 1] = I[y * W1 + x + 1] + row; } }
    const s = Math.max(15, Math.floor(Math.max(w, h) / 8)), hs = s >> 1, b = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      const y1 = Math.max(0, y - hs), y2 = Math.min(h - 1, y + hs);
      for (let x = 0; x < w; x++) {
        const x1 = Math.max(0, x - hs), x2 = Math.min(w - 1, x + hs), cnt = (x2 - x1 + 1) * (y2 - y1 + 1);
        const sum = I[(y2 + 1) * W1 + x2 + 1] - I[y1 * W1 + x2 + 1] - I[(y2 + 1) * W1 + x1] + I[y1 * W1 + x1];
        b[y * w + x] = g[y * w + x] * cnt <= sum * (1 - t) ? 1 : 0;
      }
    }
    return b;
  }

  function components(b, w, h) {
    const lab = new Int32Array(w * h), out = [], stack = new Int32Array(w * h);
    const big = Math.max(w, h), minSide = big * 0.009, maxSide = big * 0.14;
    let id = 0;
    for (let p = 0; p < b.length; p++) {
      if (!b[p] || lab[p]) continue;
      id++; let sp = 0; stack[sp++] = p; lab[p] = id;
      let cnt = 0, sx = 0, sy = 0, minx = w, miny = h, maxx = 0, maxy = 0;
      while (sp) {
        const q = stack[--sp], x = q % w, y = (q / w) | 0;
        cnt++; sx += x; sy += y;
        if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
        if (x > 0 && b[q - 1] && !lab[q - 1]) { lab[q - 1] = id; stack[sp++] = q - 1; }
        if (x < w - 1 && b[q + 1] && !lab[q + 1]) { lab[q + 1] = id; stack[sp++] = q + 1; }
        if (y > 0 && b[q - w] && !lab[q - w]) { lab[q - w] = id; stack[sp++] = q - w; }
        if (y < h - 1 && b[q + w] && !lab[q + w]) { lab[q + w] = id; stack[sp++] = q + w; }
      }
      const bw = maxx - minx + 1, bh = maxy - miny + 1;
      if (bw < minSide || bh < minSide || bw > maxSide || bh > maxSide) continue;
      const ar = bw / bh, fill = cnt / (bw * bh);
      if (ar < 0.55 || ar > 1.8 || fill < 0.68) continue;
      out.push({ x: sx / cnt, y: sy / cnt, area: cnt, bw, bh, fill });
    }
    return out;

  function solve(A, bv) {

/* ===== Acceso: usuarios, contraseñas cifradas (PBKDF2) y roles ===== */
const LocalAuth = (() => {
  const LS_USERS = 'lc_users_v1', SS_SESSION = 'lc_session_v1', LS_LOCK = 'lc_lock_v1';
  const ITER = 150000, IDLE_MIN = 30;
  let db = null;            // { updated, users: [...] }
  let remoteUpdated = 0;    // fecha del usuarios.json publicado (0 si no hay)
  let session = null;       // { u, role, name, mustChange }
  let lastActivity = Date.now();

  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function hash(password, saltB64) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(saltB64), iterations: ITER, hash: 'SHA-256' }, key, 256);
    return b64(bits);
  }
  const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));
  const norm = u => String(u || '').trim().toLowerCase();

  function saveLocal() { try { localStorage.setItem(LS_USERS, JSON.stringify(db)); } catch (e) { } }
  async function makeUser(u, name, role, password, mustChange) {
    const salt = newSalt();
    return { u: norm(u), name: name || u, role, salt, hash: await hash(password, salt), active: true, mustChange: !!mustChange, created: Date.now(), pwAt: Date.now() };
  }

  async function init() {
    let local = null, remote = null;
    try { local = JSON.parse(localStorage.getItem(LS_USERS) || 'null'); } catch (e) { }
    // En GitHub Pages: usuarios.json publicado junto a index.html
    try {
      if (location.protocol.startsWith('http')) {
        const r = await fetch('usuarios.json?v=' + Date.now(), { cache: 'no-store' });
        if (r.ok) { const j = await r.json(); if (j && Array.isArray(j.users)) remote = j; }
      }
    } catch (e) { }
    remoteUpdated = remote ? remote.updated || 0 : 0;
    const both = [local, remote].filter(Boolean).sort((a, b) => (b.updated || 0) - (a.updated || 0));
    db = both[0] ? JSON.parse(JSON.stringify(both[0])) : null;
    // la contraseña más reciente de cada usuario gana (así un tutor conserva la clave que cambió en su equipo)
    if (db && both[1]) db.users.forEach(x => { const o = both[1].users.find(y => y.u === x.u); if (o && (o.pwAt || 0) > (x.pwAt || 0)) Object.assign(x, { salt: o.salt, hash: o.hash, mustChange: o.mustChange, pwAt: o.pwAt }); });
    if (!db || !db.users.some(x => x.role === 'admin' && x.active)) {
      db = { updated: 0, users: [await makeUser('administrador', 'Administrador', 'admin', 'administrador', true)] };
    }
    saveLocal();
    try { const s = JSON.parse(sessionStorage.getItem(SS_SESSION) || 'null'); if (s && s.exp > Date.now() && db.users.some(x => x.u === s.u && x.active)) session = s; } catch (e) { }
    ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastActivity = Date.now(); if (session) touch(); }, { passive: true }));
    setInterval(() => { if (session && Date.now() - lastActivity > IDLE_MIN * 60000) { logout(); toast('Sesión cerrada por inactividad.'); } }, 30000);
  }
  function touch() { session.exp = Date.now() + IDLE_MIN * 60000; try { sessionStorage.setItem(SS_SESSION, JSON.stringify(session)); } catch (e) { } }

  function lockInfo() { try { return JSON.parse(localStorage.getItem(LS_LOCK) || '{"n":0,"until":0}'); } catch (e) { return { n: 0, until: 0 }; } }
  async function login(u, p) {
    const lk = lockInfo();
    if (lk.until > Date.now()) return { ok: false, err: `Demasiados intentos. Espera ${Math.ceil((lk.until - Date.now()) / 1000)} segundos.` };
    const user = db.users.find(x => x.u === norm(u));
    const ok = user && user.active && (await hash(p, user.salt)) === user.hash;
    if (!ok) {
      lk.n++; if (lk.n >= 5) { lk.until = Date.now() + 60000 * Math.min(10, lk.n - 4); }
      try { localStorage.setItem(LS_LOCK, JSON.stringify(lk)); } catch (e) { }
      return { ok: false, err: user && !user.active ? 'Este usuario está bloqueado. Consulta con el administrador.' : 'Usuario o contraseña incorrectos.' };
    }
    try { localStorage.setItem(LS_LOCK, JSON.stringify({ n: 0, until: 0 })); } catch (e) { }
    session = { u: user.u, role: user.role, name: user.name, mustChange: !!user.mustChange };
    lastActivity = Date.now(); touch();
    return { ok: true };
  }
  function logout() { session = null; try { sessionStorage.removeItem(SS_SESSION); } catch (e) { } if (typeof Cam !== 'undefined') Cam.stop(); render(); }

  function checkPw(p) {
    if (p.length < 8) return 'Usa al menos 8 caracteres.';
    if (!/[A-Za-zÁÉÍÓÚáéíóúñÑ]/.test(p) || !/\d/.test(p)) return 'Combina letras y números.';
    if (/^(12345678|password|contraseña|administrador)/i.test(p)) return 'Esa contraseña es muy fácil de adivinar.';
    return null;
  }
  async function changeOwn(current, next) {
    const user = db.users.find(x => x.u === session.u);
    if (!user || (await hash(current, user.salt)) !== user.hash) return 'La contraseña actual no es correcta.';
    const e = checkPw(next); if (e) return e;
    user.salt = newSalt(); user.hash = await hash(next, user.salt); user.mustChange = false; user.pwAt = Date.now();
    session.mustChange = false; touch(); if (isAdmin()) commit(); else saveLocal();
    return null;
  }
  function commit() { db.updated = Date.now(); saveLocal(); }

  // Administración (solo administradores)
  const isAdmin = () => session && session.role === 'admin';
  async function createUser(u, name, role, password) {
    if (!isAdmin()) return 'Sin permiso.';
    u = norm(u);
    if (!/^[a-z0-9._-]{3,30}$/.test(u)) return 'El usuario debe tener de 3 a 30 caracteres: letras, números, punto o guion.';
    if (db.users.some(x => x.u === u)) return 'Ese usuario ya existe.';
    const e = checkPw(password); if (e) return e;
    db.users.push(await makeUser(u, name.trim() || u, role, password, true)); commit(); return null;
  }
  async function resetPw(u, password) {
    if (!isAdmin()) return 'Sin permiso.';
    const e = checkPw(password); if (e) return e;
    const user = db.users.find(x => x.u === u); if (!user) return 'No existe.';
    user.salt = newSalt(); user.hash = await hash(password, user.salt); user.mustChange = true; user.pwAt = Date.now(); commit(); return null;
  }
  function activeAdmins() { return db.users.filter(x => x.role === 'admin' && x.active).length; }
  function toggle(u) {
    const user = db.users.find(x => x.u === u); if (!user || !isAdmin()) return 'Sin permiso.';
    if (user.u === session.u) return 'No puedes bloquear tu propia cuenta.';
    if (user.active && user.role === 'admin' && activeAdmins() <= 1) return 'Debe quedar al menos un administrador activo.';
    user.active = !user.active; commit(); return null;
  }
  function remove(u) {
    const user = db.users.find(x => x.u === u); if (!user || !isAdmin()) return 'Sin permiso.';
    if (user.u === session.u) return 'No puedes eliminar tu propia cuenta.';
    if (user.role === 'admin' && activeAdmins() <= 1) return 'Debe quedar al menos un administrador activo.';
    db.users = db.users.filter(x => x.u !== u); commit(); return null;
  }
  function setRole(u, role) {
    const user = db.users.find(x => x.u === u); if (!user || !isAdmin()) return 'Sin permiso.';
    if (user.u === session.u) return 'No puedes cambiar tu propio rol.';
    if (user.role === 'admin' && role !== 'admin' && activeAdmins() <= 1) return 'Debe quedar al menos un administrador activo.';
    user.role = role; commit(); return null;
  }
  const exportJson = () => JSON.stringify({ app: 'lector-cartillas', updated: db.updated || Date.now(), users: db.users }, null, 2);
  const pending = () => location.protocol.startsWith('http') && (db.updated || 0) > remoteUpdated;
  const isDefault = () => db.users.length === 1 && db.users[0].u === 'administrador' && db.users[0].mustChange;

  return {
    init, login, logout, changeOwn, createUser, resetPw, toggle, remove, setRole, exportJson, pending, isDefault, isAdmin, checkPw,
    get session() { return session; }, get users() { return db ? db.users : []; }, get published() { return remoteUpdated > 0; }
  };
})();

/* ===== Nube (Supabase): datos compartidos en tiempo real, usuarios y exámenes virtuales ===== */
const SB_LIB = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const USER_DOMAIN = 'lector-cartillas.app';
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); });
}

const Cloud = {
  on: false, sb: null, cfg: null, status: 'off', chan: null, timers: {}, pendingRender: false, loading: false,
  async loadConfig() {
    let cfg = null;
    try {
      if (location.protocol.startsWith('http')) {
        const r = await fetch('config.json?v=' + Date.now(), { cache: 'no-store' });
        if (r.ok) { const j = await r.json(); if (j && j.supabaseUrl) { cfg = j; cfg.from = 'archivo'; } }
      }
    } catch (e) { }
    if (!cfg) try { const j = JSON.parse(localStorage.getItem('lc_cloud') || 'null'); if (j && j.supabaseUrl) { cfg = j; cfg.from = 'navegador'; } } catch (e) { }
    return cfg && cfg.supabaseUrl && cfg.supabaseKey ? cfg : null;
  },
  async lib() {
    if (!(window.supabase && window.supabase.createClient)) await loadScript(SB_LIB);
    return window.supabase;
  },
  async client(cfg, opts = {}) {
    const lib = await this.lib();
    return lib.createClient(cfg.supabaseUrl.trim().replace(/\/+$/, ''), cfg.supabaseKey.trim(), { auth: { storage: window.sessionStorage, storageKey: 'lc_sb_auth', persistSession: true, autoRefreshToken: true, ...opts } });
  },
  async init(cfg) { this.cfg = cfg; this.sb = await this.client(cfg); this.on = true; },
  async test(cfg) {
    try {
      const c = await this.client(cfg, { persistSession: false, autoRefreshToken: false, storageKey: 'lc_test' });
      const { error } = await c.rpc('hay_admin');
      if (error) return /hay_admin/.test(error.message || '') ? 'Conectó, pero falta ejecutar el script SQL en Supabase.' : 'Error: ' + error.message;
      return null;
    } catch (e) { return 'No se pudo conectar: ' + e.message; }
  },
  /* ---- datos compartidos ---- */
  async start() {
    if (!this.on) return;
    this.loading = true; S.exams = {}; S.results = {}; S.groups = {}; render();
    const all = []; let from = 0;
    for (; ;) {
      const { data, error } = await this.sb.from('docs').select('id,kind,data').order('id').range(from, from + 999);
      if (error) { this.loading = false; this.status = 'error'; toast('No se pudieron cargar los datos de la nube: ' + error.message); render(); return; }
      all.push(...data); if (data.length < 1000) break; from += 1000;
    }
    all.forEach(row => this.apply(row.kind, row.data));
    this.loading = false; this.subscribe(); Store.saveLocal(); render();
  },
  stop() { if (this.chan) { this.sb.removeChannel(this.chan); this.chan = null; } this.status = 'off'; S.exams = {}; S.results = {}; S.groups = {}; S.quizzes = {}; S.intentos = {}; },
  map(kind) { return kind === 'exam' ? S.exams : kind === 'res' ? S.results : kind === 'grp' ? S.groups : null; },
  apply(kind, obj) { const m = this.map(kind); if (m && obj && obj.id) m[obj.id] = obj; },
  subscribe() {
    if (this.chan) this.sb.removeChannel(this.chan);
    this.chan = this.sb.channel('lector-' + Math.random().toString(36).slice(2))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
        if (p.eventType === 'DELETE') { const id = (p.old && p.old.id) || ''; const i = id.indexOf('_'); const m = this.map(id.slice(0, i)); if (m) delete m[id.slice(i + 1)]; }
        else if (p.new) { if (this.timers[p.new.id]) return; this.apply(p.new.kind, p.new.data); }
        Store.soon(); this.later();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'quizzes' }, p => {
        if (p.eventType === 'DELETE') { delete S.quizzes[p.old.id]; } else if (p.new) S.quizzes[p.new.id] = p.new;
        this.later();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'intentos' }, p => {
        const row = p.new && p.new.id ? p.new : p.old; if (!row) return;
        Object.keys(S.intentos).forEach(q => { S.intentos[q] = (S.intentos[q] || []).filter(x => x.id !== row.id); });
        if (p.eventType !== 'DELETE' && S.intentos[row.quiz_id]) S.intentos[row.quiz_id].push(row);
        this.later();
      })
      .subscribe(st => { this.status = st === 'SUBSCRIBED' ? 'live' : (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') ? 'error' : this.status; const el = document.querySelector('.sync'); if (el) el.innerHTML = syncLabel(); });
  },
  // vuelve a dibujar sin interrumpir a quien está escribiendo
  later() {
    clearTimeout(this.rt);
    this.rt = setTimeout(() => {
      const a = document.activeElement;
      if (a && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'file') { this.pendingRender = true; return; }
      render();
    }, 150);
  },
  put(kind, obj) {
    const id = kind + '_' + obj.id;
    clearTimeout(this.timers[id]);
    this.timers[id] = setTimeout(async () => {
      const { error } = await this.sb.from('docs').upsert({ id, kind, data: JSON.parse(JSON.stringify(obj)), updated_at: new Date().toISOString() });
      setTimeout(() => { delete this.timers[id]; }, 1500);
      if (error) { console.warn(error); toast('No se pudo guardar en la nube: ' + error.message); }
    }, 600);
  },
  async del(kind, id) {
    const { error } = await this.sb.from('docs').delete().eq('id', kind + '_' + id);
    if (error) toast('No se pudo borrar en la nube: ' + error.message);
  },
  async uploadLocal() {
    let j = null; try { j = JSON.parse(localStorage.getItem(LSK) || 'null'); } catch (e) { }
    if (!j) return 0;
    const rows = [];
    Object.values(j.groups || {}).forEach(o => rows.push({ id: 'grp_' + o.id, kind: 'grp', data: o }));
    Object.values(j.exams || {}).forEach(o => rows.push({ id: 'exam_' + o.id, kind: 'exam', data: o }));
    Object.values(j.results || {}).forEach(o => rows.push({ id: 'res_' + o.id, kind: 'res', data: o }));
    for (let i = 0; i < rows.length; i += 50) {
      const { error } = await this.sb.from('docs').upsert(rows.slice(i, i + 50));
      if (error) throw error;
    }
    rows.forEach(r => this.apply(r.kind, r.data));
    return rows.length;
  }
};

/* ---------- Usuarios en la nube (Supabase Auth) ---------- */
const CloudAuth = (() => {
  let session = null, users = [], needsSetup = false, lastActivity = Date.now();
  const norm = u => String(u || '').trim().toLowerCase();
  const mail = u => `${norm(u)}@${USER_DOMAIN}`;
  const sb = () => Cloud.sb;
  async function loadProfile(uid) {
    const { data, error } = await sb().from('perfiles').select('*').eq('id', uid).maybeSingle();
    if (error) return { err: /permission|denied|42501/i.test(error.message || '') ? 'Supabase no da permiso para leer los perfiles. Vuelve a ejecutar el script SQL actualizado (trae los permisos que faltan).' : 'No se pudo leer tu perfil: ' + error.message };
    if (!data) return { err: 'Tu cuenta no tiene perfil en el programa. Pide al administrador que la cree.' };
    if (!data.activo) return { err: 'Este usuario está bloqueado. Consulta con el administrador.' };
    session = { id: data.id, u: data.usuario, role: data.rol, name: data.nombre || data.usuario, mustChange: !!data.debe_cambiar };
    return {};
  }
  async function init() {
    const { data } = await sb().auth.getSession();
    if (data && data.session) { const r = await loadProfile(data.session.user.id); if (r.err) { await sb().auth.signOut(); session = null; } }
    if (!session) { const { data: h, error } = await sb().rpc('hay_admin'); if (error) throw new Error(error.message); needsSetup = !h; }
    ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true }));
    setInterval(() => { if (session && Date.now() - lastActivity > 30 * 60000) { logout(); toast('Sesión cerrada por inactividad.'); } }, 30000);
  }
  async function login(u, p) {
    const { data, error } = await sb().auth.signInWithPassword({ email: mail(u), password: p });
    if (error) return { ok: false, err: /confirm/i.test(error.message) ? 'La cuenta no está confirmada. En Supabase desactiva "Confirm email" (ver instrucciones).' : 'Usuario o contraseña incorrectos.' };
    const r = await loadProfile(data.user.id);
    if (r.err) { await sb().auth.signOut(); return { ok: false, err: r.err }; }
    lastActivity = Date.now();
    await Cloud.start();
    return { ok: true };
  }
  async function logout() { session = null; try { await sb().auth.signOut(); } catch (e) { } Cloud.stop(); if (typeof Cam !== 'undefined') Cam.stop(); render(); }
  async function setupAdmin(u, name, pass) {
    if (!/^[a-z0-9._-]{3,30}$/.test(norm(u))) return 'El usuario debe tener de 3 a 30 caracteres: letras, números, punto o guion.';
    const e = LocalAuth.checkPw(pass); if (e) return e;
    const { data, error } = await sb().auth.signUp({ email: mail(u), password: pass });
    if (error) return /signups? (are|is) disabled|signup.*disabled/i.test(error.message) ? 'Supabase tiene desactivado el registro de usuarios. En Authentication › Sign In / Providers activa "Allow new users to sign up" y el proveedor Email (deja apagado solo "Confirm email").' : 'Supabase no aceptó la cuenta: ' + error.message;
    if (!data.session) return 'La cuenta se creó pero falta confirmarla. En Supabase › Authentication › Sign In / Providers › Email, desactiva "Confirm email" y vuelve a intentarlo con otro usuario.';
    const { data: r, error: e2 } = await sb().rpc('registrar_primer_admin', { p_usuario: norm(u), p_nombre: name || u });
    if (e2 || (r && r.error)) return 'No se pudo registrar el administrador: ' + (e2 ? e2.message : r.error);
    await loadProfile(data.user.id); needsSetup = false; await Cloud.start();
    return null;
  }
  async function changeOwn(current, next) {
    const e = LocalAuth.checkPw(next); if (e) return e;
    const { error: e1 } = await sb().auth.signInWithPassword({ email: mail(session.u), password: current });
    if (e1) return 'La contraseña actual no es correcta.';
    const { error } = await sb().auth.updateUser({ password: next });
    if (error) return 'No se pudo cambiar: ' + error.message;
    await sb().rpc('marcar_clave_cambiada'); session.mustChange = false;
    return null;
  }
  const isAdmin = () => !!session && session.role === 'admin';
  async function loadUsers() {
    const { data, error } = await sb().from('perfiles').select('*').order('usuario');
    if (!error) users = data.map(p => ({ id: p.id, u: p.usuario, name: p.nombre || p.usuario, role: p.rol, active: p.activo, mustChange: p.debe_cambiar }));
    return users;
  }
  const byU = u => users.find(x => x.u === u);
  async function createUser(u, name, role, password) {
    if (!isAdmin()) return 'Sin permiso.';
    u = norm(u);
    if (!/^[a-z0-9._-]{3,30}$/.test(u)) return 'El usuario debe tener de 3 a 30 caracteres: letras, números, punto o guion.';
    if (byU(u)) return 'Ese usuario ya existe.';
    const e = LocalAuth.checkPw(password); if (e) return e;
    // un cliente aparte para no cerrar la sesión del administrador
    const c2 = await Cloud.client(Cloud.cfg, { persistSession: false, autoRefreshToken: false, storageKey: 'lc_sb_tmp', storage: undefined });
    const { data, error } = await c2.auth.signUp({ email: mail(u), password });
    if (error) return /registered/i.test(error.message) ? 'Ese usuario ya existe en Supabase.' : /signups? (are|is) disabled|signup.*disabled/i.test(error.message) ? 'Supabase tiene desactivado el registro de usuarios. En Authentication › Sign In / Providers activa "Allow new users to sign up" y el proveedor Email.' : 'Supabase no aceptó la cuenta: ' + error.message;
    if (!data.user) return 'Supabase no devolvió el usuario creado.';
    const { error: e2 } = await sb().from('perfiles').insert({ id: data.user.id, usuario: u, nombre: (name || '').trim() || u, rol: role, debe_cambiar: true });
    if (e2) return 'No se pudo guardar el perfil: ' + e2.message;
    await loadUsers(); return null;
  }
  async function resetPw(u, password) {
    if (!isAdmin()) return 'Sin permiso.';
    const e = LocalAuth.checkPw(password); if (e) return e;
    const x = byU(u); if (!x) return 'No existe.';
    const { data, error } = await sb().rpc('admin_cambiar_clave', { p_user: x.id, p_clave: password });
    if (error || (data && data.error)) return 'No se pudo cambiar: ' + (error ? error.message : data.error);
    await loadUsers(); return null;
  }
  const adminsActive = () => users.filter(x => x.role === 'admin' && x.active).length;
  async function toggle(u) {
    const x = byU(u); if (!x || !isAdmin()) return 'Sin permiso.';
    if (x.u === session.u) return 'No puedes bloquear tu propia cuenta.';
    if (x.active && x.role === 'admin' && adminsActive() <= 1) return 'Debe quedar al menos un administrador activo.';
    const { error } = await sb().from('perfiles').update({ activo: !x.active }).eq('id', x.id);
    if (error) return error.message; await loadUsers(); return null;
  }
  async function remove(u) {
    const x = byU(u); if (!x || !isAdmin()) return 'Sin permiso.';
    if (x.u === session.u) return 'No puedes eliminar tu propia cuenta.';
    if (x.role === 'admin' && adminsActive() <= 1) return 'Debe quedar al menos un administrador activo.';
    const { data, error } = await sb().rpc('admin_eliminar_usuario', { p_user: x.id });
    if (error || (data && data.error)) return 'No se pudo eliminar: ' + (error ? error.message : data.error);
    await loadUsers(); return null;
  }
  async function setRole(u, role) {
    const x = byU(u); if (!x || !isAdmin()) return 'Sin permiso.';
    if (x.u === session.u) return 'No puedes cambiar tu propio rol.';
    if (x.role === 'admin' && role !== 'admin' && adminsActive() <= 1) return 'Debe quedar al menos un administrador activo.';
    const { error } = await sb().from('perfiles').update({ rol: role }).eq('id', x.id);
    if (error) return error.message; await loadUsers(); return null;
  }
  return {
    cloud: true, init, login, logout, setupAdmin, changeOwn, createUser, resetPw, toggle, remove, setRole, loadUsers, isAdmin,
    checkPw: p => LocalAuth.checkPw(p), pending: () => false, isDefault: () => false, exportJson: () => '',
    get session() { return session; }, get users() { return users; }, get published() { return true; }, get needsSetup() { return needsSetup; }
  };
})();

async function uploadPdf(file) {
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { toast('El archivo debe ser PDF.'); return null; }
  if (file.size > 45 * 1024 * 1024) { toast('El PDF pesa más de 45 MB. Comprímelo e inténtalo de nuevo.'); return null; }
  const path = `quiz/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.pdf`;
  const up = await Cloud.sb.storage.from('examenes').upload(path, file, { contentType: 'application/pdf', upsert: false });
  if (up.error) { toast('No se pudo subir el PDF: ' + up.error.message + (/bucket/i.test(up.error.message) ? ' (vuelve a ejecutar el script SQL en Supabase)' : '')); return null; }
  return Cloud.sb.storage.from('examenes').getPublicUrl(path).data.publicUrl;
}

    Store.put('exam', ex); // la nube necesita la evaluación (clave) para calificar
    const { data, error } = await sb.from('quizzes').insert({ exam_id: ex.id, titulo, minutos, n_preguntas: ex.nQ, pdf_url, mostrar_nota: $('#qShow').checked }).select().single();
    if (!error) S.qForm = { ex: ex.id };
    if (error) { toast('No se pudo crear: ' + error.message); render(); return; }
    S.quizzes[data.id] = data; S.intentos[data.id] = [];
    toast('Examen virtual creado. Copia el enlace y compártelo con tus alumnos.'); render(); return;
  }
  const q = S.quizzes[el.dataset.id];
  if (act === 'qcopy') { try { await navigator.clipboard.writeText(quizLink(q)); toast('Enlace copiado'); } catch (e) { toast('Copia el enlace del recuadro.'); } return; }
  if (act === 'qclose') { const { data, error } = await sb.rpc('cerrar_vencidos', { p_quiz: q.id }); toast(error ? 'Error: ' + error.message : `${data} intentos calificados`); S.qLoaded = null; render(); return; }
  if (act === 'qdel') {
    if (!confirm(`¿Eliminar el examen virtual "${q.titulo}"? Se borran sus intentos; las notas ya enviadas siguen en Resultados.`)) return;
    const { error } = await sb.from('quizzes').delete().eq('id', q.id);
    if (error) { toast('No se pudo eliminar: ' + error.message); return; }
    delete S.quizzes[q.id]; delete S.intentos[q.id]; render(); return;
  }
  if (act === 'qdelint') {
    const id = el.dataset.id, qid = Object.keys(S.intentos).find(k => (S.intentos[k] || []).some(t => t.id === id));
    if (!confirm('¿Reiniciar este intento? El alumno podrá empezar el examen de nuevo con su DNI. Si ya lo había enviado, su nota sigue en Resultados hasta que la borres.')) return;
    const { error } = await sb.from('intentos').delete().eq('id', id);
    if (error) { toast('No se pudo reiniciar: ' + error.message); return; }
    if (qid) S.intentos[qid] = S.intentos[qid].filter(t => t.id !== id); render(); return;
  }
}

/* ===== Almacenamiento: navegador + nube privada del usuario (si está disponible) ===== */
const LSK = 'lector_cartillas_v1';
const Store = {
  col: null, timers: {},
  loadLocal() {
    try { const j = JSON.parse(localStorage.getItem(LSK) || 'null'); if (j) { S.exams = j.exams || {}; S.results = j.results || {}; S.groups = j.groups || {}; } } catch (e) { }
  },
  saveLocal() {
    if (Cloud.on) return;
    try { localStorage.setItem(LSK, JSON.stringify({ groups: S.groups, exams: S.exams, results: S.results })); }
    catch (e) {
      try {
        const slim = {}; for (const [k, r] of Object.entries(S.results)) slim[k] = { ...r, img: null };
        localStorage.setItem(LSK, JSON.stringify({ groups: S.groups, exams: S.exams, results: slim }));
      } catch (e2) { }
    }
  },
  soon() { if (Cloud.on) return; clearTimeout(this.lt); this.lt = setTimeout(() => this.saveLocal(), 300); },
  put(kind, obj) {
    if (Cloud.on) return Cloud.put(kind, obj);
    this.soon();
    if (!this.col) return;
    const key = kind + '_' + obj.id;
    clearTimeout(this.timers[key]);
    this.timers[key] = setTimeout(() => {
      this.col.doc(key).set(JSON.parse(JSON.stringify(obj))).catch(e => console.warn('db', e));
    }, 700);
  },
  del(kind, id) { if (Cloud.on) return Cloud.del(kind, id); this.soon(); if (this.col) this.col.doc(kind + '_' + id).delete().catch(() => { }); },
  async connect() {
    if (!(window.claude && window.claude.use)) return;
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      const col = db.collection('data/users/' + id);
      const snap = await col.get();
      const cE = {}, cR = {}, cG = {};
      snap.docs.forEach(d => { const v = d.data(); if (!v || !v.id) return; if (d.id.startsWith('exam_')) cE[v.id] = v; else if (d.id.startsWith('res_')) cR[v.id] = v; else if (d.id.startsWith('grp_')) cG[v.id] = v; });
      this.col = col;
      for (const e of Object.values(S.exams)) if (!cE[e.id]) this.put('exam', e);
      for (const g of Object.values(S.groups)) if (!cG[g.id]) this.put('grp', g);
      Object.assign(S.groups, cG);
      for (const r of Object.values(S.results)) if (!cR[r.id]) this.put('res', r);
      Object.assign(S.exams, cE);
      for (const r of Object.values(cR)) { const l = S.results[r.id]; S.results[r.id] = (!r.img && l && l.img) ? { ...r, img: l.img } : r; }
      S.synced = true; this.saveLocal(); render();
    } catch (e) { console.warn('sin nube', e); }
  }
};

function rowsToStudents(rows) {

  for (let i = 0; i < Math.min(rows.length, 15) && hi < 0; i++) {
    const r = rows[i].map(low);
    const d = r.findIndex(x => /^(dni|documento|nro\.? ?documento|n° ?dni|codigo|cod\.?|id)$/.test(x) || /\bdni\b/.test(x));
    const nm = r.findIndex(x => /^(nombre|nombres y apellidos|apellidos y nombres|nombre completo|alumno|estudiante)s?$/.test(x));
    const ap = r.findIndex(x => /^apellidos?$/.test(x)), no = r.findIndex(x => /^nombres?$/.test(x));
    if (d >= 0 && (nm >= 0 || no >= 0)) { hi = i; cDni = d; cName = nm; cApe = ap; cNom = no; }
  }
  if (hi < 0) return { err: 'No encontré los encabezados. La primera fila debe decir "DNI" y "Nombre".' };
  const list = [], seen = new Set();
  for (const r of rows.slice(hi + 1)) {

    const name = (cApe >= 0 && cNom >= 0 && cApe !== cName ? `${String(r[cApe] ?? '').trim()} ${String(r[cNom] ?? '').trim()}` : String(r[cName >= 0 ? cName : cNom] ?? '')).replace(/\s+/g, ' ').trim();

}
async function importStudents(file, exams) {
  let rows;

    if (/\.xlsx$/i.test(file.name)) rows = await readXlsxRows(await file.arrayBuffer());
    else if (/\.(csv|txt)$/i.test(file.name)) rows = readCsvRows(await file.text());

  } catch (e) { console.error(e); toast('No se pudo leer el archivo. Guárdalo como .xlsx o .csv e inténtalo otra vez.'); return; }

  if (r.err) { toast(r.err); return; }
  const ok = r.list.filter(x => !x.bad), bad = r.list.filter(x => x.bad);
  if (!ok.length) { toast('No encontré alumnos con DNI y nombre en el archivo.'); return; }
  // se combina con la lista actual: agrega nuevos y actualiza los nombres de los que ya estaban
  const cur = rosterMap(exams[0]); let added = 0, upd = 0;
  ok.forEach(x => { if (cur[x.dni] === undefined) added++; else if (cur[x.dni] !== x.name) upd++; cur[x.dni] = x.name; });
  const text = Object.entries(cur).map(([k, v]) => `${k}, ${v}`).join('\n');
  const maxLen = Math.max(...ok.map(x => x.dni.length));
  exams.forEach(ex => { ex.roster = text; });
  const short = exams.filter(ex => ex.idDigits < maxLen);
  if (short.length && confirm(`Los DNI tienen ${maxLen} dígitos, pero la hoja tiene espacio para ${short[0].idDigits}. ¿Cambiar el código de la hoja a ${maxLen} dígitos?\n\nSi ya imprimiste hojas de esta evaluación, tendrás que imprimirlas de nuevo.`)) {
    short.forEach(ex => { ex.idDigits = maxLen; });
  }
  exams.forEach(ex => Store.put('exam', ex));
  render();
  const pl = (n, a, b) => `${n} ${n === 1 ? a : b}`;
  toast(`${pl(added, 'alumno agregado', 'alumnos agregados')}${upd ? `, ${pl(upd, 'actualizado', 'actualizados')}` : ''}${bad.length ? `. ${pl(bad.length, 'fila omitida', 'filas omitidas')} (sin DNI numérico o sin nombre)` : ''}.`);
}

const Cam = {
  stream: null, timer: null, prev: null, stable: 0, waitLost: false, busy: false, auto: true, work: document.createElement('canvas'),
  async start() {
    try {
