    } catch (e) {
      toast('No se pudo abrir la cámara aquí. Usa "Tomar foto" o "Subir imágenes".'); return;
    }
    render();
    const v = $('#vid'); if (!v) return;
    v.srcObject = this.stream; await v.play().catch(() => { });

  },
  stop() { clearTimeout(this.timer); if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; },
  loop() {
    clearTimeout(this.timer);

  },
  tick() {
    const v = $('#vid'), ov = $('#ov'), ex = curExam();

    if (S.camResult) { const o = ov.getContext('2d'); o.clearRect(0, 0, ov.width, ov.height); return; }
    const vw = v.videoWidth, vh = v.videoHeight, s = 1100 / Math.max(vw, vh);
    const w = Math.round(vw * s), h = Math.round(vh * s), c = this.work; c.width = w; c.height = h;

    const g = OMR.grayFromRGBA(ctx.getImageData(0, 0, w, h).data, w, h);
    const L = layoutOf(ex), loc = OMR.locateAll(g, w, h, L, ex.sens);
    ov.width = w; ov.height = h;
    const o = ov.getContext('2d'); o.clearRect(0, 0, w, h);
    const pill = $('#pill');
    if (!loc.ok) { this.stable = 0; this.prev = null; this.lastSig = null; this.waitLost = false; if (pill) { pill.textContent = loc.err; pill.className = 'pill'; } return; }
    // Lee cada pregunta en vivo y la dibuja sobre la imagen (como ZipGrade)
    const reads = loc.sheets.map(sh => {
      const r = OMR.readMarks({ b: loc.b, map: sh.map }, w, h, L, ex.thr, ex.autoThr !== false);
      drawLive(o, sh, r, grade(ex, r.answers), L, ex);

    this.sameRead = sig === this.lastSig ? (this.sameRead || 0) + 1 : 0;
    this.lastSig = sig;
    const P = loc.sheets.flatMap(sh => sh.corners);
    const same = this.prev && this.prev.length === P.length;
    const move = same ? P.reduce((a, p, i) => a + Math.hypot(p.x - this.prev[i].x, p.y - this.prev[i].y), 0) / P.length / w : 1;
    this.prev = P.map(p => ({ x: p.x, y: p.y }));
    this.stable = move < 0.03 ? this.stable + 1 : 0;
    const n = loc.sheets.length;
    const g0 = grade(ex, reads[0].answers);
    const txt = n > 1 ? `${n} cartillas: leyendo…` : (ex.key.some(Boolean) ? `${g0.T.c} / ${g0.T.n} correctas` : `${reads[0].answers.filter(Boolean).length} marcadas (sin clave)`);

    if (this.auto && this.sameRead >= 1 && this.stable >= 1) this.capture();
  },
  grab(max) {
    const v = $('#vid'), vw = v.videoWidth, vh = v.videoHeight, s = Math.min(1, max / Math.max(vw, vh));
    const c = document.createElement('canvas'); c.width = Math.round(vw * s); c.height = Math.round(vh * s);

  },

    const v = $('#vid'), ex = curExam(); if (!v || !ex || v.readyState < 2 || this.busy) return;

    const frames = [];

      const R = readCanvas(this.grab(2200), ex);
      if (R.ok) frames.push(R.sheets);

    }
    this.busy = false;

        .filter(x => x && Math.hypot(x.center.x - sh.center.x, x.center.y - sh.center.y) < 60);
      const doubts = new Set();
      const answers = sh.answers.map((_, i) => {

    this.stable = 0; this.sameRead = 0; this.lastSig = null; if (navigator.vibrate) navigator.vibrate(60);

function pageGrid(ex, n) {
  const L = layoutOf(ex), PW = 200, PH = 287, G = 6;
  let best = null;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const tw = (PW - (c - 1) * G) / c, th = (PH - (r - 1) * G) / r;
    const scale = Math.min(tw / L.W, th / L.H);
    if (!best || scale > best.scale) best = { c, r, scale };
  }
  const tw = L.W * best.scale, th = L.H * best.scale;
  const gw = best.c * tw + (best.c - 1) * G, gh = best.r * th + (best.r - 1) * G;
  best.x0 = 5 + (PW - gw) / 2; best.y0 = 5 + (PH - gh) / 2; best.tw = tw; best.th = th; best.G = G;
  best.bubbleMM = 2 * L.r * best.scale; // diámetro impreso del círculo en mm
  return best;
}
function pageSVG(ex, n, fills) {
  const P = pageGrid(ex, n), inner = [];
  for (let i = 0; i < n; i++) {
    const c = i % P.c, r = Math.floor(i / P.c);
    const x = P.x0 + c * (P.tw + P.G), y = P.y0 + r * (P.th + P.G);
    const L = layoutOf(ex);
    const svg = sheetSVG(ex, fills && fills[i]).replace(` width="${L.W}" height="${L.H}"`, '').replace('<svg ', `<svg x="${x}" y="${y}" width="${P.tw}" height="${P.th}" `);
    inner.push(svg);
  }
  const cuts = [];
  for (let c = 1; c < P.c; c++) { const x = P.x0 + c * (P.tw + P.G) - P.G / 2; cuts.push(`<line x1="${x}" y1="2" x2="${x}" y2="295" stroke="#bbb" stroke-width="0.25" stroke-dasharray="2 2"/>`); }
  for (let r = 1; r < P.r; r++) { const y = P.y0 + r * (P.th + P.G) - P.G / 2; cuts.push(`<line x1="2" y1="${y}" x2="208" y2="${y}" stroke="#bbb" stroke-width="0.25" stroke-dasharray="2 2"/>`); }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="1600" height="2262"><rect width="210" height="297" fill="#fff"/>${cuts.join('')}${inner.join('')}</svg>`;
}

function homeView() {

  const cards = exams.map(ex => {

      <h2>Evaluaciones</h2>
      <div class="row"><button class="btn primary" data-act="new">Nueva evaluación</button><button class="btn" data-act="example">Ejemplo individual</button><button class="btn" data-act="exampleuni">Ejemplo UNI</button></div>
    </div>

      <div class="choose-grid">
        <button class="choose-card" data-act="newind"><b>Evaluación individual</b><span>Un examen con su clave, cursos y puntaje. Resultados y Excel de ese examen.</span></button>

      <p class="muted">Elige una evaluación individual o una estilo UNI de 3 evaluaciones. Define cuántas preguntas tiene, qué curso va en cada tramo y cuánto vale cada pregunta. Luego imprime la hoja y escanéala con la cámara.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="new">Nueva evaluación</button><button class="btn" data-act="example">Ejemplo individual</button><button class="btn" data-act="exampleuni">Ejemplo UNI</button></div></div>`}
    <div class="panel" style="margin-top:22px"><h3>Respaldo</h3>
      <p class="muted small">Guarda todas tus evaluaciones y resultados en un archivo, o recupéralos en otro equipo.</p>
      <div class="row"><button class="btn sm" data-act="backup">Descargar respaldo</button>
      <label class="btn sm">Importar respaldo<input type="file" accept=".json,application/json" id="impFile" class="hidden"></label></div></div>`;

const UNI_C = ['#2F6FDE', '#C2410C', '#8E44AD'];
function groupView(g) {
  const exs = groupExams(g), rows = uniRows(g), K = exs.length, pass = +g.pass || 11;
  const q = (S.gq || '').toLowerCase();
  const list = rows.filter(r => !q || r.display.toLowerCase().includes(q) || (r.code || '').includes(q));
  const avg = rows.length ? rows.reduce((a, r) => a + r.notaFinal, 0) / rows.length : 0;
  const nPass = rows.filter(r => r.notaFinal >= pass).length, full = rows.filter(r => r.rendidas === K).length;
  const cards = exs.map((ex, k) => {
    const rs = examResults(ex), av = rs.length ? rs.reduce((a, r) => { const t = grade(ex, r.answers).T; return a + n20(t.score, t.max); }, 0) / rs.length : null;
    const keyN = ex.key.filter(Boolean).length;
    return `<div class="uni-card" style="--c:${UNI_C[k]}">
      <div class="uni-num">E${k + 1}</div>
      <input type="text" value="${esc(ex.name)}" data-exname="${ex.id}" id="exn${k}" aria-label="Nombre de la evaluación ${k + 1}" class="uni-name">
      <div class="small muted">${ex.nQ} preguntas · ${ex.sections.length || 'sin'} cursos · clave ${keyN}/${ex.nQ}</div>
      <div class="stats"><span><b>${rs.length}</b>hojas</span><span><b>${av == null ? '–' : fmt(av)}</b>promedio /20</span></div>
      ${keyN < ex.nQ ? `<div class="small" style="color:var(--warn);font-weight:700">Falta completar la clave</div>` : ''}
      <button class="btn primary sm" data-act="open" data-id="${ex.id}">Abrir: configurar, hoja y escanear</button>
    </div>`;
  }).join('');
  const table = list.map((r, i) => `<tr data-act="uniDetail" data-key="${esc(r.key)}">
    <td class="muted">${rows.indexOf(r) + 1}</td><td>${esc(r.code || '—')}</td><td><b>${esc(r.display)}</b>${r.rendidas < K ? ` <span class="st warn">rindió ${r.rendidas}/${K}</span>` : ''}</td>
    ${r.per.map((p, k) => `<td>${p.in ? `<span class="eff-cell" style="background:${heat(p.nota / 20)};color:#fff">${fmt(p.nota)}</span>` : '<span class="muted small">no rindió</span>'}</td>`).join('')}
    <td class="note-cell ${r.notaFinal >= pass ? 'pass' : 'fail'}">${r.notaFinal.toFixed(2)}</td>
    <td>${fmt(r.scoreAcum)}</td><td>${r.scoreFinal.toFixed(2)}</td>
    <td>${r.notaFinal >= pass ? '<span class="st ok">Aprobado</span>' : '<span class="st bad">Desaprobado</span>'}</td></tr>`).join('');
  return `<div class="panel"><div class="row" style="justify-content:space-between;align-items:flex-end">
      <label class="f" style="flex:1;min-width:220px">Nombre del simulacro UNI<input type="text" id="grpName" value="${esc(g.name)}" data-grp="name"></label>
      <label class="f" style="width:150px">Nota aprobatoria<input type="number" id="grpPass" step="any" value="${pass}" data-grp="pass"></label></div>
    <p class="muted small" style="margin-bottom:0">Cada evaluación se configura, se imprime y se escanea por separado. La <b>nota final</b> es el promedio de las ${K} notas (0 a 20); si un estudiante no rinde una, esa nota cuenta como 0. Las notas se juntan por el <b>código</b> del alumno: que marque el mismo en las ${K} hojas.</p></div>
    <div class="uni-grid">${cards}</div>
    <div class="panel"><h3>Alumnos (para las ${K} evaluaciones)</h3>
      <p class="muted small">Una línea por alumno: DNI, nombre. Se aplica a las ${K} evaluaciones. Al escanear, el nombre se completa solo según el DNI marcado en la hoja.</p>
      <div class="row" style="margin-bottom:8px"><label class="btn sm primary">Importar alumnos (Excel o CSV)<input type="file" accept=".xlsx,.csv,.txt" data-import="grp" class="hidden"></label><button class="btn sm" data-act="rostertpl">Descargar plantilla</button><span class="small muted">Encabezados: <b>DNI</b> y <b>Nombre</b></span></div>
      <textarea id="grpRoster" data-grp="roster" placeholder="70123456, Quispe Mamani Ana">${esc(exs[0] ? exs[0].roster : '')}</textarea></div>
    <div class="panel"><div class="row" style="justify-content:space-between">
        <h3>Resultados finales</h3>
        <div class="row"><button class="btn primary" data-act="uniexcel">Exportar Excel UNI</button></div></div>
      ${rows.length ? `<div class="kpis" style="margin-top:12px">
        <div class="kpi"><b>${rows.length}</b><span>estudiantes · ${full} rindieron las ${K}</span></div>
        <div class="kpi"><b>${avg.toFixed(2)}</b><span>nota final promedio /20</span></div>
        <div class="kpi"><b>${nPass}</b><span>aprobados (${pct(nPass / rows.length)})</span></div>
        <div class="kpi"><b>${rows[0].notaFinal.toFixed(2)}</b><span>primer puesto: ${esc(rows[0].display)}</span></div></div>
      <input type="text" id="gsearch" placeholder="Buscar por nombre o código" value="${esc(S.gq || '')}" style="max-width:300px">
      <div class="scroll-x" style="margin-top:10px"><table class="res"><thead><tr><th>#</th><th>Código</th><th>Estudiante</th>${exs.map((ex, k) => `<th style="color:${UNI_C[k]}">E${k + 1}</th>`).join('')}<th>Nota final</th><th>Puntaje acum.</th><th>Puntaje final</th><th>Estado</th></tr></thead><tbody>${table}</tbody></table></div>
      <p class="muted small">Toca un estudiante para ver sus hojas. Puntaje acumulado = suma de los ${K} puntajes; puntaje final = su promedio.</p>`
      : `<p class="muted">Aún no hay hojas escaneadas. Abre cada evaluación, configúrala, imprime su hoja y escanea.</p>`}
    </div>
    ${Auth.isAdmin() ? `<div class="row"><button class="btn danger" data-act="delgrp">Eliminar simulacro UNI</button></div>` : ''}`;
}

function examView(ex) {
  if (S.tab === 'config') return configView(ex);
  if (S.tab === 'sheet') return sheetView(ex);
  if (S.tab === 'scan') return scanView(ex);
  if (S.tab === 'results') return resultsView(ex);
  if (S.tab === 'virtual') return virtualView(ex);
  return statsView(ex);
}

function sectionWarnings(ex) {
  const w = [], cover = Array(ex.nQ).fill(0);
  ex.sections.forEach(s => {
    if (!(+s.from >= 1 && +s.to >= +s.from)) w.push(`El rango de "${s.name}" no es válido.`);
    if (+s.to > ex.nQ) w.push(`"${s.name}" llega a la pregunta ${s.to}, pero la hoja tiene ${ex.nQ}.`);
    for (let i = +s.from; i <= Math.min(+s.to, ex.nQ); i++) cover[i - 1]++;
  });
  const dup = cover.map((c, i) => c > 1 ? i + 1 : 0).filter(Boolean);
  if (dup.length) w.push(`Preguntas en más de un curso: ${dup.slice(0, 12).join(', ')}${dup.length > 12 ? '…' : ''}. Cuenta el primer curso de la lista.`);
  const none = cover.map((c, i) => c === 0 ? i + 1 : 0).filter(Boolean);
  if (ex.sections.length && none.length) w.push(`${none.length} pregunta(s) sin curso (${none.slice(0, 8).join(', ')}${none.length > 8 ? '…' : ''}); se agrupan en "Sin curso" con 1 punto.`);
  return w;
}

function configView(ex) {
  const hasRes = examResults(ex).length > 0;
  const warn = sectionWarnings(ex);
  const secRows = ex.sections.map((s, i) => `<tr>
    <td><input type="color" value="${s.color}" data-sec="${i}" data-f="color" aria-label="Color" style="width:34px;height:30px;padding:0;border:0;background:none"></td>
    <td><input type="text" value="${esc(s.name)}" data-sec="${i}" data-f="name" id="sn${i}" aria-label="Nombre del curso" style="min-width:140px"></td>
    <td class="num"><input type="number" min="1" max="${ex.nQ}" value="${s.from}" data-sec="${i}" data-f="from" id="sf${i}" aria-label="Desde"></td>
    <td class="num"><input type="number" min="1" max="${ex.nQ}" value="${s.to}" data-sec="${i}" data-f="to" id="st${i}" aria-label="Hasta"></td>
    <td class="num"><input type="number" step="any" value="${s.pts}" data-sec="${i}" data-f="pts" id="sp${i}" aria-label="Puntos por correcta"></td>
    <td class="num"><input type="number" step="any" value="${s.wrong}" data-sec="${i}" data-f="wrong" id="sw${i}" aria-label="Puntos por incorrecta"></td>
    <td class="num"><input type="number" step="any" value="${s.blank}" data-sec="${i}" data-f="blank" id="sb${i}" aria-label="Puntos en blanco"></td>
    <td><button class="btn ghost sm" data-act="delsec" data-i="${i}" aria-label="Quitar curso">✕</button></td></tr>`).join('');
  let keyHtml = '', lastSec = null;
  for (let i = 0; i < ex.nQ; i++) {
    const s = secOf(ex, i + 1);
    if (s !== lastSec) { keyHtml += `<div class="key-sec"><span class="swatch" style="background:${s.color}"></span>${esc(s.name)} <span class="small muted" style="font-family:var(--body);font-weight:400">${s.pts} pts c/u</span></div>`; lastSec = s; }
    const k = ex.key[i] || '', ov = ex.ptsOv[i];
    keyHtml += `<div class="krow${keyFlag(ex, i) ? ' kflag' : ''}" title="${esc(keyFlag(ex, i))}"><span class="kn" style="--c:${s.color}">${i + 1}</span>${LET.map(l => `<button class="kb ${keyHas(k, l) ? 'on' : ''}" data-act="key" data-i="${i}" data-l="${l}" aria-label="Pregunta ${i + 1} alternativa ${l}">${l}</button>`).join('')}
      <button class="kbonus ${k === '*' ? 'on' : ''}" data-act="key" data-i="${i}" data-l="*" title="Anular pregunta: todos reciben el puntaje" aria-label="Anular pregunta ${i + 1}">★</button>
      <input class="kpts" type="number" step="any" placeholder="${s.pts}" value="${ov ?? ''}" data-ov="${i}" id="ov${i}" aria-label="Puntaje de la pregunta ${i + 1}"></div>`;
  }
  return `
  <div class="panel"><h3>Datos de la evaluación</h3>
    <div class="grid-fields">
      <label class="f">Nombre<input type="text" id="exName" value="${esc(ex.name)}" data-ex="name"></label>
      <label class="f">Cantidad de preguntas<input type="number" id="exNQ" min="1" max="100" value="${ex.nQ}" data-ex="nQ"></label>
      <label class="f">Dígitos del código<input type="number" id="exID" min="0" max="10" value="${ex.idDigits}" data-ex="idDigits"></label>
      <label class="f">Escala de nota<select id="exScale" data-ex="scale">
        <option value="20" ${ex.scale == 20 ? 'selected' : ''}>Vigesimal (0 a 20)</option>
        <option value="100" ${ex.scale == 100 ? 'selected' : ''}>0 a 100</option>
        <option value="10" ${ex.scale == 10 ? 'selected' : ''}>0 a 10</option>
        <option value="0" ${ex.scale == 0 ? 'selected' : ''}>Puntaje directo</option></select></label>
      <label class="f">Nota aprobatoria<input type="number" id="exPass" step="any" value="${ex.pass}" data-ex="pass" ${ex.scale == 0 ? 'disabled' : ''}></label>
    </div>
    ${hasRes ? `<p class="note small">Si cambias la cantidad de preguntas o de dígitos, la hoja cambia y las ya impresas dejarán de leerse con esta evaluación.</p>` : ''}
  </div>

  <div class="panel"><h3>Cursos y puntaje</h3>
    <p class="muted small">Asigna un tramo de preguntas a cada curso. Los puntos por incorrecta pueden ser negativos (por ejemplo −0.5) si tu examen descuenta.</p>
    <div class="scroll-x"><table class="sec-table"><thead><tr><th></th><th>Curso</th><th>Desde</th><th>Hasta</th><th>Correcta</th><th>Incorrecta</th><th>En blanco</th><th></th></tr></thead><tbody>${secRows}</tbody></table></div>
    ${warn.map(t => `<div class="note small">${esc(t)}</div>`).join('')}
    <div class="row" style="margin-top:10px"><button class="btn sm" data-act="addsec">Agregar curso</button>
      <span class="row small muted">Repartir en <input type="number" min="1" max="20" value="${Math.max(2, ex.sections.length || 5)}" id="splitN" style="width:64px"> cursos iguales <button class="btn sm" data-act="split">Repartir</button></span></div>
  </div>

  <div class="panel" id="keyPanel"><h3>Clave de respuestas</h3>
    <div class="key-scan">
      <div><b>Escanear la cartilla de respuestas correctas</b>
        <p class="small muted" style="margin:2px 0 0">Imprime una hoja de esta evaluación, rellena la alternativa correcta de cada pregunta y escanéala: la clave se llena sola y con ella se corrigen todos los exámenes.</p></div>
      <div class="row">
        <button class="btn primary sm" data-act="keycam">Escanear con la cámara</button>
        <label class="btn sm">Tomar foto<input type="file" accept="image/*" capture="environment" data-keyfile="1" class="hidden"></label>
        <label class="btn sm">Subir imagen<input type="file" accept="image/*" data-keyfile="1" class="hidden"></label>
      </div>
    </div>
    ${keyScanSummary(ex)}

  <div class="panel"><h3>Alumnos</h3>

    <textarea id="roster" data-ex="roster" placeholder="70123456, Quispe Mamani Ana">${esc(ex.roster)}</textarea>

  <div class="panel"><h3>Lectura</h3>

      <label class="f">Contraste para detectar lápiz: <b id="sensV">${Math.round(ex.sens * 100)}</b><input type="range" min="0.06" max="0.3" step="0.01" value="${ex.sens}" data-ex="sens" id="exSens"></label>
    </div>
    <p class="muted small">Baja el relleno mínimo si el lápiz es tenue; súbelo si los borrones cuentan como marca.</p>

/* ===== Preguntas a favor: corrige rápido una pregunta mal planteada para todos ===== */
const keyHas = (k, l) => !!k && k !== '*' && (k === l || (k.length > 1 && l.length === 1 && k.includes(l)));
function parseQs(txt, n) {
  const out = new Set();
  String(txt || '').split(/[,;\s]+/).filter(Boolean).forEach(part => {
    const m = part.match(/^(\d+)(?:-(\d+))?$/); if (!m) return;
    let a = +m[1], b = +(m[2] || m[1]); if (a > b) [a, b] = [b, a];
    for (let i = a; i <= b; i++) if (i >= 1 && i <= n) out.add(i - 1);
  });
  return [...out].sort((x, y) => x - y);
}
function favorPanel(ex, rows) {
  const fav = ex.favor || {}, items = Object.keys(fav).map(Number).sort((a, b) => a - b);
  const list = items.length ? `<div class="fav-list">${items.map(i => {

  }).join('')}</div>` : '';
  const open = S.favOpen === ex.id;

      <button class="btn ${open ? '' : 'primary'} sm" data-act="favtoggle">${open ? 'Cerrar' : 'Dar preguntas a favor'}</button></div>

    ${open ? `<div class="fav-form">

        <label class="fav-mode"><input type="radio" name="favMode" value="alt"><span><b>Aceptar también otra alternativa</b><br><span class="small muted">Cuenta como correcta la clave original y además:</span>
          <span class="fav-letters">${LET.map(l => `<label><input type="checkbox" name="favAlt" value="${l}">${l}</label>`).join('')}</span></span></label>
      </div>
      <button class="btn primary" data-act="favapply">Aplicar y recalificar</button></div>` : ''}

}
function applyFavor(ex, qs, mode, alts) {
  const before = examResults(ex).map(r => ({ id: r.id, n: grade(ex, r.answers).T.note }));
  ex.favor = ex.favor || {};
  const skipped = [];
  qs.forEach(i => {
    const cur = ex.key[i] || '';
    const orig = ex.favor[i] ? ex.favor[i].orig : cur;
    if (mode === 'all') ex.key[i] = '*';
    else {
      if (!orig || orig === '*') { skipped.push(i + 1); return; }
      const set = new Set((orig + alts.join('')).split(''));
      ex.key[i] = LET.filter(l => set.has(l)).join('');
      if (ex.key[i] === orig) { skipped.push(i + 1); return; }
    }
    ex.favor[i] = { orig, mode, at: Date.now() };
  });
  Store.put('exam', ex);
  const after = examResults(ex).map(r => grade(ex, r.answers).T.note);
  const up = after.filter((n, j) => n > before[j].n + 1e-9).length;
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  return { up, n: after.length, from: avg(before.map(b => b.n)), to: avg(after), skipped };
}
function undoFavor(ex, i) {
  const f = (ex.favor || {})[i];
  ex.key[i] = f ? f.orig : (ex.key[i] === '*' ? '' : ex.key[i]);
  if (ex.favor) delete ex.favor[i];
  Store.put('exam', ex);
}

function statsView(ex) {
  const rows = rowsFor(ex);
  if (!rows.length) return `<div class="panel empty"><h2>Sin datos todavía</h2><p class="muted">El análisis aparece cuando escaneas al menos una hoja.</p><button class="btn primary" data-act="tab" data-tab="scan">Ir a escanear</button></div>`;
  const n = rows.length, notes = rows.map(x => x.g.T.note);
  const avg = notes.reduce((a, b) => a + b, 0) / n;
  const effT = rows.reduce((a, x) => a + x.g.T.c, 0) / Math.max(1, rows.reduce((a, x) => a + x.g.T.n, 0));
  const nPass = rows.filter(x => passes(ex, x.g.T.note)).length;
  const sd = Math.sqrt(notes.reduce((a, v) => a + (v - avg) ** 2, 0) / n);
  // por curso
  const secs = rows[0].g.secs.map((s, j) => {
    const c = rows.reduce((a, x) => a + x.g.secs[j].c, 0), tot = rows.reduce((a, x) => a + x.g.secs[j].n, 0);
    return { s: s.sec, eff: tot ? c / tot : 0, note: rows.reduce((a, x) => a + x.g.secs[j].note, 0) / n, score: rows.reduce((a, x) => a + x.g.secs[j].score, 0) / n, max: s.max, n: s.n };
  });
  // histograma
  const top = ex.scale > 0 ? ex.scale : Math.max(1, rows[0].g.T.max);
  const B = 10, bins = Array(B).fill(0);
  notes.forEach(v => bins[Math.min(B - 1, Math.max(0, Math.floor(v / top * B)))]++);
  const bmax = Math.max(...bins);
  const hist = `<svg viewBox="0 0 400 190" role="img" aria-label="Distribución de notas" style="width:100%;height:auto">
    ${bins.map((c, i) => { const h = bmax ? c / bmax * 140 : 0, x = 10 + i * 38, lo = top * i / B; const ok = ex.scale > 0 ? lo + top / B / 2 >= ex.pass : true;
      return `<rect x="${x}" y="${155 - h}" width="32" height="${h}" rx="3" fill="${ok ? 'var(--ok)' : 'var(--bad)'}" opacity=".85"/>${c ? `<text x="${x + 16}" y="${150 - h}" font-size="12" text-anchor="middle" fill="currentColor">${c}</text>` : ''}<text x="${x + 16}" y="172" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">${fmt(lo)}</text>`; }).join('')}
    <line x1="6" y1="155" x2="394" y2="155" stroke="currentColor" opacity=".3"/></svg>`;
  // análisis por pregunta
  const sorted = rows.slice().sort((a, b) => b.g.T.score - a.g.T.score);
  const kk = Math.max(1, Math.round(n * 0.27)), hi = sorted.slice(0, kk), lo = sorted.slice(-kk);
  const items = Array.from({ length: ex.nQ }, (_, i) => {
    const st = rows.map(x => x.g.per[i]);
    const keyed = st[0].st !== 'nokey';
    const p = st.filter(z => z.st === 'ok' || z.st === 'bonus').length / n;
    const okIn = arr => arr.filter(x => ['ok', 'bonus'].includes(x.g.per[i].st)).length / arr.length;
    const dist = {}; LET.forEach(l => dist[l] = 0); dist.blank = 0; dist.multi = 0;
    rows.forEach(x => { const a = x.r.answers[i] || ''; if (!a) dist.blank++; else if (a.length > 1) dist.multi++; else dist[a]++; });
    return { i, keyed, p, D: n >= 4 ? okIn(hi) - okIn(lo) : null, dist, key: ex.key[i], sec: secOf(ex, i + 1) };
  });
  const sel = S.item != null && items[S.item] ? items[S.item] : null;
  const hardest = items.filter(t => t.keyed && t.key !== '*').sort((a, b) => a.p - b.p).slice(0, 5);
  return `<div class="kpis">
      <div class="kpi"><b>${n}</b><span>hojas evaluadas</span></div>
      <div class="kpi"><b>${fmt(avg)}</b><span>promedio ${scaleLabel(ex)}</span></div>
      <div class="kpi"><b>${pct(effT)}</b><span>eficiencia total</span></div>
      <div class="kpi"><b>${fmt(Math.max(...notes))}</b><span>nota más alta</span></div>
      <div class="kpi"><b>${fmt(Math.min(...notes))}</b><span>nota más baja</span></div>
      ${ex.scale > 0 ? `<div class="kpi"><b>${nPass}</b><span>aprobados (${pct(nPass / n)})</span></div>` : ''}
      <div class="kpi"><b>${fmt(sd)}</b><span>desviación estándar</span></div>
    </div>
    <div class="two">

function itemPanel(t, n) {

/* ===== Detalle de una hoja (como la revisión de ZipGrade) ===== */
function overlaySVG(ex, g, res) {
  const L = layoutOf(ex), R = L.r + 3.5, o = [`<svg viewBox="0 0 ${L.W} ${L.H}" aria-hidden="true">`];
  const doubts = new Set(res.doubts || []);
  L.q.forEach((q, i) => {
    const p = g.per[i]; if (!p) return;
    const col = (p.st === 'ok' || p.st === 'bonus') ? '#1FA95A' : p.st === 'nokey' ? '#8A939B' : '#E0392B';
    (p.a || '').split('').forEach(l => { const b = q.b[LET.indexOf(l)]; if (b) o.push(`<circle cx="${b.x}" cy="${b.y}" r="${R}" fill="none" stroke="${col}" stroke-width="3.5"/>`); });
    if (p.k && p.k !== '*' && p.st !== 'ok') p.k.split('').forEach(l => { const b = q.b[LET.indexOf(l)]; if (b) o.push(`<circle cx="${b.x}" cy="${b.y}" r="${R}" fill="none" stroke="#1FA95A" stroke-width="3" stroke-dasharray="4 3"/>`); });
    if (doubts.has(i)) o.push(`<rect x="${q.labelX - L.p * 1.05}" y="${q.y - L.p * 0.46}" width="${q.b[4].x + L.r + 6 - (q.labelX - L.p * 1.05)}" height="${L.p * 0.92}" rx="6" fill="#F2BE2C" fill-opacity=".22" stroke="#D69E00" stroke-width="2"/>`);
    if (p.st !== 'nokey') o.push(`<text x="${q.labelX - L.p * 0.95}" y="${q.y + 6}" font-size="${Math.round(L.p * 0.45)}" font-weight="700" fill="${col}" font-family="Arial">${p.st === 'ok' || p.st === 'bonus' ? 'c' : p.st === 'blank' ? '–' : 'x'}</text>`);
  });
  if (L.idDigits > 0 && res.studentId) {
    L.id.forEach(pt => { if (String(res.studentId)[pt.d] === String(pt.v)) o.push(`<circle cx="${pt.x}" cy="${pt.y}" r="${R}" fill="none" stroke="#2F6FDE" stroke-width="3.5"/>`); });
  }
  o.push('</svg>');
  return o.join('');
}

// Acepta la URL del proyecto aunque se pegue con /rest/v1, con / al final o el enlace del panel de Supabase
function normalizeSbUrl(u) {
  u = String(u || '').trim().replace(/^["']|["']$/g, '');
  const dash = u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
  if (dash) return `https://${dash[1].toLowerCase()}.supabase.co`;
  if (/^[a-z0-9]{15,30}$/i.test(u)) return `https://${u.toLowerCase()}.supabase.co`;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return x.hostname.includes('.') ? 'https://' + x.host : ''; } catch (e) { return ''; }
}

// Datos para el Excel del salón (dashboard, por curso, por estudiante)
function excelData(ex) {
  const rows = rowsFor(ex).sort((a, b) => b.g.T.score - a.g.T.score || (a.r.name || '').localeCompare(b.r.name || ''));
  const base = rows.length ? rows[0].g.secs : grade(ex, []).secs;
  const sections = base.map(g => ({ name: g.sec.name, color: (g.sec.color || '#5B6770').replace('#', '').toUpperCase(), from: g.sec.from ?? '—', to: g.sec.to ?? '—', n: g.n, max: g.max }));
  const seen = {};
  const students = rows.map((x, i) => {
    let display = (x.r.name || '').trim() || (x.r.studentId ? `Código ${x.r.studentId}` : `Hoja ${i + 1}`);
    if (seen[display]) display += ` (${x.r.studentId || i + 1})`;
    seen[display] = 1;
    return { rid: x.r.id, code: (x.r.studentId || '').includes('?') ? '' : (x.r.studentId || ''), name: x.r.name || '', display, score: x.g.T.score, max: x.g.T.max, c: x.g.T.c, w: x.g.T.w, b: x.g.T.b, n: x.g.T.n,
      secs: x.g.secs.map(s => ({ score: s.score, max: s.max, c: s.c, w: s.w, b: s.b, n: s.n })) };
  });
  const n = rows.length;
  const hard = Array.from({ length: ex.nQ }, (_, i) => {
    const k = ex.key[i]; if (!k || k === '*' || !n) return null;
    const ok = rows.filter(x => x.g.per[i].st === 'ok').length;
    const cnt = {}; rows.forEach(x => { const a = x.r.answers[i] || ''; const key = !a ? 'En blanco' : a.length > 1 ? 'Doble marca' : a; cnt[key] = (cnt[key] || 0) + 1; });
    const most = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    return { q: i + 1, sec: secOf(ex, i + 1).name, p: ok / n, key: k, most: most ? most[0] : '' };
  }).filter(Boolean).sort((a, b) => a.p - b.p).slice(0, 5);
  return { exam: ex.name, date: new Date().toLocaleDateString('es-PE'), nQ: ex.nQ, pass20: ex.scale > 0 ? +ex.pass * 20 / ex.scale : 11, sections, students, hard };
}

function tableData(ex) {
  const rows = rowsFor(ex).sort((a, b) => b.g.T.score - a.g.T.score);
  const secs = rows.length ? rows[0].g.secs : [];
  const head = ['Puesto', 'Código', 'Alumno', 'Nota', 'Puntaje', 'Máximo', 'Eficiencia %', 'Correctas', 'Incorrectas', 'En blanco', ...secs.flatMap(s => [s.sec.name + ' nota', s.sec.name + ' eficiencia %']), ...Array.from({ length: ex.nQ }, (_, i) => 'P' + (i + 1))];
  const body = rows.map((x, i) => [i + 1, x.r.studentId, x.r.name, fmt(x.g.T.note), fmt(x.g.T.score), fmt(x.g.T.max), Math.round(x.g.T.eff * 100), x.g.T.c, x.g.T.w, x.g.T.b,
    ...x.g.secs.flatMap(s => [fmt(s.note), Math.round(s.eff * 100)]), ...Array.from({ length: ex.nQ }, (_, j) => x.r.answers[j] || '')]);
  return [head, ...body];
}

    case 'split': {
      const k = Math.max(1, Math.min(20, +$('#splitN').value || 1)), size = Math.ceil(ex.nQ / k);
      const old = ex.sections;
      ex.sections = Array.from({ length: k }, (_, i) => ({ id: old[i]?.id || uid(), name: old[i]?.name || 'Curso ' + (i + 1), from: i * size + 1, to: Math.min(ex.nQ, (i + 1) * size), pts: old[i]?.pts ?? 1, wrong: old[i]?.wrong ?? 0, blank: old[i]?.blank ?? 0, color: old[i]?.color || COLORS[i % COLORS.length] })).filter(s => s.from <= ex.nQ);
      Store.put('exam', ex); render(); break;
    }
    case 'key': { const i = +el.dataset.i, l = el.dataset.l; ex.key[i] = ex.key[i] === l ? '' : l; Store.put('exam', ex); render(); break; }
    case 'paste': {
      const chars = ($('#pasteKey').value || '').toUpperCase().replace(/[^A-E*\-_]/g, '').split('');
      chars.slice(0, ex.nQ).forEach((c, i) => ex.key[i] = (c === '-' || c === '_') ? '' : c);
      Store.put('exam', ex); toast(`Clave aplicada a ${Math.min(chars.length, ex.nQ)} preguntas`); render(); break;
    }
    case 'clearkey': if (confirm('¿Borrar toda la clave?')) { ex.key = Array(ex.nQ).fill(''); Store.put('exam', ex); render(); } break;
    case 'delexam':
      if (!Auth.isAdmin() || ex.groupId) { toast('Solo el administrador puede eliminar evaluaciones.'); break; }
      if (confirm(`¿Eliminar "${ex.name}" y todas sus hojas escaneadas?`)) {
        examResults(ex).forEach(r => { delete S.results[r.id]; Store.del('res', r.id); });
        delete S.exams[ex.id]; Store.del('exam', ex.id); S.cur = null; render();
      } break;
    case 'print': {
      $('#printArea').innerHTML = pageSVG(ex, ex.perPage || 1).replace('width="1600" height="2262"', '');
      try { window.print(); } catch (err) { toast('La impresión directa no está disponible aquí. Usa "Descargar para imprimir".'); }
      break;
    }
    case 'png': {
      const im = await svgToImage(pageSVG(ex, ex.perPage || 1)); const c = document.createElement('canvas'); c.width = 2480; c.height = 3508;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => saveFile(`hoja-${slug(ex.name)}.png`, b), 'image/png'); break;
    }
    case 'htmlsheet': {
      const html = `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Hoja de respuestas - ${esc(ex.name)}</title><style>@page{size:A4;margin:0}html,body{margin:0}svg{width:210mm;height:297mm;display:block}</style></head><body>${pageSVG(ex, ex.perPage || 1).replace('width="1600" height="2262"', '')}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`;
      saveFile(`hoja-${slug(ex.name)}.html`, html); break;
    }
    case 'mode': S.scanMode = el.dataset.m; S.keyReturn = false; render(); break;
    case 'camon': Cam.start(); break;
    case 'keycam': S.scanMode = 'clave'; S.keyReturn = true; S.tab = 'scan'; render(); window.scrollTo(0, 0); Cam.start(); break;
    case 'keyscanok': S.keyScan = null; render(); break;
    case 'camoff': Cam.stop(); render(); break;
    case 'capture': S.camResult = null; Cam.capture(); break;
    case 'sim': simulate(); break;
    case 'crnext': S.camResult = null; Cam.waitLost = false; Cam.sameRead = 0; Cam.lastSig = null; render(); break;
    case 'cridx': S.camIdx = Math.max(0, (S.camIdx || 0) + +el.dataset.d); render(); break;
    case 'detail': { S.detail = el.dataset.id; const rr = S.results[S.detail]; S.detView = rr && rr.img ? 'img' : 'q'; render(); break; }
    case 'close': S.detail = null; render(); break;
    case 'closebg': S.detail = null; render(); break;
    case 'dview': S.detView = el.dataset.v; render(); break;
    case 'nav': { const r = S.results[S.detail], list = examResults(S.exams[r.examId]); const i = list.findIndex(x => x.id === r.id) + +el.dataset.d; if (list[i]) { S.detail = list[i].id; render(); } break; }
    case 'edit': {
      const r = S.results[S.detail], i = +el.dataset.i, l = el.dataset.l; const a = r.answers[i] || '';
      r.answers[i] = a.includes(l) ? a.replace(l, '') : LET.filter(x => (a + l).includes(x)).join('');
      r.edited = true; r.doubts = (r.doubts || []).filter(x => x !== i); Store.put('res', r); render(); break;
    }
    case 'okdoubt': { const r = S.results[S.detail]; r.doubts = []; r.idDoubt = false; Store.put('res', r); render(); break; }
    case 'delres': if (confirm('¿Eliminar esta hoja?')) { const id = S.detail; delete S.results[id]; Store.del('res', id); S.detail = null; render(); } break;
    case 'sort': { const k = el.dataset.k; S.sort = { k, d: S.sort.k === k ? -S.sort.d : (k === 'name' || k === 'id' ? 1 : -1) }; render(); break; }
    case 'item': S.item = S.item === +el.dataset.i ? null : +el.dataset.i; render(); break;
    case 'favtoggle': S.favOpen = S.favOpen === ex.id ? null : ex.id; S.favMsg = null; render(); break;
    case 'favapply': case 'favone': {
      const qs = act === 'favone' ? [+el.dataset.i] : parseQs($('#favQ').value, ex.nQ);
      if (!qs.length) { toast('Escribe el número de la pregunta (ej.: 5 o 12-14).'); break; }
      const mode = act === 'favone' ? 'all' : (document.querySelector('input[name=favMode]:checked') || {}).value || 'all';
      const alts = [...document.querySelectorAll('input[name=favAlt]:checked')].map(x => x.value);
      if (mode === 'alt' && !alts.length) { toast('Marca qué alternativa también será correcta.'); break; }
      const noKey = qs.filter(i => !ex.key[i] && mode === 'alt').map(i => i + 1);
      if (!confirm(`¿${mode === 'all' ? 'Dar como correcta para todos' : 'Aceptar también ' + alts.join(', ') + ' en'} la pregunta ${qs.map(i => i + 1).join(', ')}? Se recalificarán las ${examResults(ex).length} hojas.`)) break;
      const r = applyFavor(ex, qs, mode, alts);
      S.favOpen = null;
      S.favMsg = { ex: ex.id, html: `<b>Listo:</b> ${r.up} de ${r.n} estudiantes subieron su nota. Promedio: ${fmt(r.from)} → <b>${fmt(r.to)}</b> ${scaleLabel(ex)}.${r.skipped.length ? ` No se cambió la pregunta ${r.skipped.join(', ')} (${noKey.length ? 'no tenía clave' : 'ya era correcta esa alternativa'}).` : ''} Si exportas el Excel, ya sale con las notas corregidas.` };
      toast(`Recalificado: ${r.up} estudiantes subieron su nota.`);
      if (act === 'favone') { S.tab = 'results'; window.scrollTo(0, 0); }
      render(); break;
    }
    case 'favundo': {
      if (!confirm(`¿Deshacer el cambio de la pregunta ${+el.dataset.i + 1} y volver a su clave original?`)) break;
      undoFavor(ex, +el.dataset.i); S.favMsg = null; toast('Pregunta restaurada; las notas se recalcularon.'); render(); break;
    }
    case 'excel': {
      try {
        const data = excelData(ex);
        if (!data.students.length) { toast('Todavía no hay hojas para exportar.'); break; }
        const bytes = buildReport(data);
        await saveFile(`resultados-${slug(ex.name)}.xlsx`, new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      } catch (err) { console.error(err); toast('No se pudo crear el Excel.'); }
      break;
    }
    case 'csv': { const t = tableData(ex); saveFile(`resultados-${slug(ex.name)}.csv`, '\ufeff' + t.map(r => r.map(csvCell).join(',')).join('\n')); break; }
    case 'copy': {
      const t = tableData(ex).map(r => r.join('\t')).join('\n');
      try { await navigator.clipboard.writeText(t); toast('Tabla copiada. Pégala en Excel.'); } catch (err) { toast('No se pudo copiar; usa "Descargar CSV".'); }
      break;
    }
    case 'view': S.view = S.view === 'movil' ? 'pc' : 'movil'; Prefs.set('view', S.view); applyPrefs(); render(); window.scrollTo(0, 0); toast(S.view === 'movil' ? 'Formato celular' : 'Formato PC'); break;
    case 'theme': S.theme = isDark() ? 'light' : 'dark'; Prefs.set('theme', S.theme); applyPrefs(); render(); break;
    case 'rostertpl': rosterTemplate(); break;
    case 'backup': saveFile('respaldo-cartillas.json', JSON.stringify({ app: 'lector-cartillas', v: 2, groups: S.groups, exams: S.exams, results: S.results })); break;
  }
});
const slug = s => (s || 'evaluacion').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'evaluacion';

document.addEventListener('change', async e => {
  const t = e.target, ex = curExam();
  if (t.dataset.grp !== undefined && S.grp) {
    const g = S.groups[S.grp];
    if (t.dataset.grp === 'roster') { groupExams(g).forEach(ex => { ex.roster = t.value; Store.put('exam', ex); }); toast('Lista aplicada a las 3 evaluaciones'); }
    else { g[t.dataset.grp] = t.dataset.grp === 'pass' ? +t.value : t.value; Store.put('grp', g); }
    render(); return;
  }
  if (t.dataset.exname) { const ex = S.exams[t.dataset.exname]; ex.name = t.value || ex.name; Store.put('exam', ex); render(); return; }
  if (t.dataset.role) { const err = await Auth.setRole(t.dataset.role, t.value); if (err) toast(err); render(); return; }
  if (t.dataset.qactive) { const { error } = await Cloud.sb.from('quizzes').update({ activo: t.checked }).eq('id', t.dataset.qactive); if (error) toast(error.message); else { S.quizzes[t.dataset.qactive].activo = t.checked; render(); } return; }
  if (t.id === 'autoCap') { Cam.auto = t.checked; return; }
  if (t.id === 'sortSel') { const k = t.value; S.sort = { k, d: (k === 'name' || k === 'id') ? 1 : -1 }; render(); return; }
  if (t.id === 'perPage') { ex.perPage = +t.value; Store.put('exam', ex); render(); return; }
  if (t.id === 'autoThr') { ex.autoThr = t.checked; Store.put('exam', ex); render(); return; }
  if (t.id === 'camFile' || t.id === 'galFile') { const f = [...t.files]; t.value = ''; await processFiles(f); return; }
  if (t.dataset.keyfile) { const f = t.files[0]; t.value = ''; if (f) await scanKeyFile(f); return; }
  if (t.dataset.import) {
    const f = t.files[0]; t.value = ''; if (!f) return;
    const target = t.dataset.import === 'grp' && S.grp ? groupExams(S.groups[S.grp]) : [curExam()];
    await importStudents(f, target.filter(Boolean)); return;
  }
  if (t.id === 'impFile') {
    const f = t.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      Object.values(j.exams || {}).forEach(x => { S.exams[x.id] = x; Store.put('exam', x); });
      Object.values(j.results || {}).forEach(x => { S.results[x.id] = x; Store.put('res', x); });
      Object.values(j.groups || {}).forEach(x => { S.groups[x.id] = x; Store.put('grp', x); });
      toast('Respaldo importado'); render();
    } catch (err) { toast('Ese archivo no es un respaldo válido.'); }
    return;
  }
  if (!ex) return;
  if (t.dataset.ex) {
    const f = t.dataset.ex; let v = t.value;
    if (['nQ', 'idDigits', 'scale', 'pass', 'thr', 'sens'].includes(f)) v = +v;
    if (f === 'nQ') { v = Math.max(1, Math.min(100, Math.round(v) || 1)); ex.key = Array.from({ length: v }, (_, i) => ex.key[i] || ''); }
    if (f === 'idDigits') v = Math.max(0, Math.min(10, Math.round(v) || 0));
    ex[f] = v; Store.put('exam', ex); render(); return;
  }
  if (t.dataset.sec !== undefined) {
    const s = ex.sections[+t.dataset.sec], f = t.dataset.f;
    s[f] = ['from', 'to', 'pts', 'wrong', 'blank'].includes(f) ? (t.value === '' ? 0 : +t.value) : t.value;
    Store.put('exam', ex); render(); return;
  }
  if (t.dataset.ov !== undefined) {
    const i = +t.dataset.ov; if (t.value === '') delete ex.ptsOv[i]; else ex.ptsOv[i] = +t.value;
    Store.put('exam', ex); render(); return;
  }
  if (t.id === 'detName' || t.id === 'detId') {
    const r = S.results[S.detail]; if (!r) return;
    if (t.id === 'detName') r.name = t.value; else { r.idDoubt = false; r.studentId = t.value.trim(); if (!r.name) r.name = rosterMap(S.exams[r.examId])[r.studentId] || ''; }
    Store.put('res', r); render();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'gsearch') { S.gq = t.value; const pos = t.selectionStart; render(); const x = $('#gsearch'); if (x) { x.focus(); x.setSelectionRange(pos, pos); } return; }
  if (t.id === 'search') { S.q = t.value; const pos = t.selectionStart; render(); const s = $('#search'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } }
  if (t.id === 'exThr') $('#thrV').textContent = Math.round(t.value * 100) + '%';
  if (t.id === 'exSens') $('#sensV').textContent = Math.round(t.value * 100);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.detail) { S.detail = null; render(); }
  if (e.key === 'Enter' && !Auth.session && (e.target.id === 'lgUser' || e.target.id === 'lgPass')) { e.preventDefault(); if (e.target.id === 'lgUser') $('#lgPass').focus(); else doLogin(); }
  if (e.key === 'Enter' && ['pwCur', 'pwNew', 'pwNew2'].includes(e.target.id)) { e.preventDefault(); const b = document.querySelector('[data-act=savepw]'); if (b) b.click(); }
});
async function doLogin() {
  const u = $('#lgUser'), p = $('#lgPass'), btn = document.querySelector('[data-act=login]');
  if (!u || !p) return;
  if (!u.value.trim() || !p.value) { S.authErr = 'Escribe tu usuario y contraseña.'; $('#lgErr').textContent = S.authErr; return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Verificando…'; }
  const r = await Auth.login(u.value, p.value);
  S.authErr = r.ok ? '' : r.err;
  if (!r.ok) { const user = u.value; render(); const nu = $('#lgUser'); if (nu) { nu.value = user; $('#lgPass').focus(); } return; }
  S.page = ''; S.cur = null; render();
}

/* ===== Inicio ===== */
S.view = Prefs.get('view', matchMedia('(max-width: 760px)').matches ? 'movil' : 'pc');
S.theme = Prefs.get('theme', '');
applyPrefs();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.theme) { applyPrefs(); render(); } });
$('#app').innerHTML = '<div class="auth-wrap"><p class="muted">Cargando…</p></div>';
(async () => {
  const quizId = new URLSearchParams(location.search).get('quiz');
  const cfg = await Cloud.loadConfig();
  if (quizId) return Quiz.start(quizId, cfg); // vista del alumno: examen virtual
  if (cfg) {
    try { await Cloud.init(cfg); Auth = CloudAuth; await Auth.init(); if (Auth.session) await Cloud.start(); render(); return; }
    catch (err) {
      console.error(err); Cloud.on = false; Auth = LocalAuth;
      $('#app').innerHTML = `<div class="auth-wrap"><div class="auth-card"><h2>No se pudo conectar a la nube</h2><p class="muted">${esc(err.message || '')}</p><p class="small">Revisa tu internet. Si el problema sigue, el administrador debe revisar la conexión con Supabase.</p><button class="btn primary" onclick="location.reload()">Reintentar</button>${cfg.from === 'navegador' ? ' <button class="btn" onclick="localStorage.removeItem(\'lc_cloud\');location.reload()">Usar sin nube</button>' : ''}</div></div>`;
      return;
    }
  }
  Store.loadLocal();
  try { await LocalAuth.init(); } catch (err) { console.error(err); $('#app').innerHTML = '<div class="auth-wrap"><div class="auth-card"><h2>No se pudo iniciar</h2><p class="muted">Este navegador no permite el cifrado necesario. Abre el programa desde su enlace https (GitHub Pages) con un navegador actualizado.</p></div></div>'; return; }
  render();
  Store.connect();
})();
dl();
</script></body></html>
